title: "子供向け地図学習アプリ開発：React Nativeと地図データ活用実践ガイド"
summary: |-
  この技術書は、React Nativeを用いて子供向けの地図学習アプリを開発するための実践的なガイドです。地図ライブラリの選定からUI/UXデザイン、パフォーマンスチューニング、Firebaseを用いたデータ管理まで、開発に必要な幅広い知識を網羅しています。読者は、インタラクティブな地図アプリをゼロから構築し、デプロイ、収益化、そして継続的な改善を行うためのスキルを習得できます。

topics: 
  - ReactNative
  - MapboxGLJS
  - GeoJSON
  - Firebase
  - Redux

