<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 500 700">
    <!-- Background with subtle gradient -->
    <defs>
        <linearGradient id="bgGradient"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1">
            <stop offset="0%"
                  stop-color="#1a365d" />
            <stop offset="100%"
                  stop-color="#2d4a77" />
        </linearGradient>
        <!-- Decorative pattern -->
        <pattern id="gridPattern"
                 width="50"
                 height="50"
                 patternUnits="userSpaceOnUse">
            <path d="M 50 0 L 0 0 0 50"
                  fill="none"
                  stroke="#ffffff"
                  stroke-width="0.5"
                  stroke-opacity="0.1" />
        </pattern>
        <!-- Text gradient -->
        <linearGradient id="textGradient"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1">
            <stop offset="0%"
                  stop-color="#ffffff" />
            <stop offset="100%"
                  stop-color="#e2e8f0" />
        </linearGradient>
    </defs>
    <!-- Main background -->
    <rect width="500"
          height="700"
          fill="url(#bgGradient)" />
    <!-- Decorative overlay -->
    <rect width="500"
          height="700"
          fill="url(#gridPattern)" />
    <!-- Abstract map element -->
    <path d="M 50,500 Q 250,450 450,500 T 450,600"
          stroke="#4299e1"
          stroke-width="2"
          fill="none"
          opacity="0.3" />
    <!-- Location marker icon -->
    <circle cx="250"
            cy="180"
            r="40"
            fill="#4299e1"
            opacity="0.1" />
    <circle cx="250"
            cy="180"
            r="15"
            fill="#4299e1" />
    <!-- Main title -->
    <text x="250"
          y="280"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="82"
          font-weight="900"
          fill="url(#textGradient)"
          text-anchor="middle"
          dominant-baseline="middle">子供向け</text>
    <!-- Subtitle 1 -->
    <text x="250"
          y="350"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="50"
          font-weight="bold"
          fill="white"
          text-anchor="middle"
          dominant-baseline="middle">地図学習アプリ開発</text>
    <!-- Subtitle 2 -->
    <text x="250"
          y="410"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="35"
          font-weight="bold"
          fill="white"
          text-anchor="middle"
          dominant-baseline="middle">React Native × 地図データ活用</text>
    <!-- Decorative lines -->
    <line x1="150"
          y1="450"
          x2="350"
          y2="450"
          stroke="white"
          stroke-width="2"
          opacity="0.3" />
    <!-- Author area -->
    <text x="250"
          y="600"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="24"
          font-weight="normal"
          fill="white"
          text-anchor="middle"
          opacity="0.8">@TimelessResidents</text>
</svg>