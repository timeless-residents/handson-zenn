<svg viewBox="0 0 500 700"
     xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%">
            <stop offset="0%"
                  stop-color="#1a365d" />
            <stop offset="100%"
                  stop-color="#2a4a7f" />
        </linearGradient>
        <filter id="shadow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%">
            <feGaussianBlur in="SourceAlpha"
                            stdDeviation="5" />
            <feOffset dx="4"
                      dy="4"
                      result="offsetblur" />
            <feComponentTransfer>
                <feFuncA type="linear"
                         slope="0.8" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="glow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%">
            <feGaussianBlur stdDeviation="5"
                            result="blur" />
            <feFlood flood-color="#f8bb00"
                     flood-opacity="0.5"
                     result="glow" />
            <feComposite in="glow"
                         in2="blur"
                         operator="in"
                         result="glowBlur" />
            <feMerge>
                <feMergeNode in="glowBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    <rect width="100%"
          height="100%"
          fill="url(#bgGradient)" />
    <!-- Decorative elements -->
    <circle cx="400"
            cy="100"
            r="80"
            fill="#f8bb0033" />
    <circle cx="120"
            cy="600"
            r="60"
            fill="#ffffff10" />
    <path d="M0,300 Q250,250 500,350"
          stroke="#ffffff20"
          stroke-width="5"
          fill="none" />
    <!-- Bestseller badge -->
    <g transform="translate(380, 40)">
        <polygon points="0,0 100,0 120,30 100,60 0,60 -20,30"
                 fill="#f8bb00"
                 filter="url(#shadow)" />
        <text x="0"
              y="27"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="24"
              font-weight="bold"
              fill="#1a365d"
              text-anchor="middle"
              dominant-baseline="middle">
            <tspan x="50"
                   dy="0"
                   text-anchor="middle"
                   dominant-baseline="middle">FOR THE</tspan>
            <tspan x="50"
                   dy="20"
                   text-anchor="middle"
                   dominant-baseline="middle">ELITE</tspan>
        </text>
    </g>
    <g transform="translate(25, 50)">
        <text x="0"
              y="80"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="100"
              font-weight="bold"
              fill="#ffffff"
              text-rendering="optimizeLegibility"
              filter="url(#shadow)">
            <tspan x="0"
                   dy="0">Fintech</tspan>
        </text>
        <text x="0"
              y="200"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="90"
              font-weight="bold"
              fill="#f8bb00"
              text-rendering="optimizeLegibility"
              filter="url(#shadow)">
            <tspan x="0"
                   dy="0">コードで</tspan>
        </text>
        <text x="0"
              y="320"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="90"
              font-weight="bold"
              fill="#ffffff"
              text-rendering="optimizeLegibility"
              filter="url(#shadow)">
            <tspan x="0"
                   dy="0">金融の</tspan>
        </text>
        <text x="0"
              y="440"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="90"
              font-weight="bold"
              fill="#f8bb00"
              text-rendering="optimizeLegibility"
              filter="url(#shadow)">
            <tspan x="0"
                   dy="0">未来を</tspan>
        </text>
        <text x="0"
              y="560"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="90"
              font-weight="bold"
              fill="#ffffff"
              text-rendering="optimizeLegibility"
              filter="url(#shadow)">
            <tspan x="0"
                   dy="0">創る</tspan>
        </text>
        <!-- Author credit -->
        <text x="0"
              y="630"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="28"
              font-weight="normal"
              fill="#ffffff"
              text-rendering="optimizeLegibility">
            <tspan x="0"
                   dy="0">timeless-residents</tspan>
        </text>
    </g>
    <!-- Leaf logo with shine effect -->
    <g transform="translate(450, 650)">
        <polygon points="0,0 20,30 50,0"
                 fill="#f8bb00"
                 filter="url(#glow)" />
        <polygon points="0,0 20,30 20,0"
                 fill="#ffffff"
                 filter="url(#shadow)" />
        <polygon points="20,30 50,0 20,0"
                 fill="#ffffff"
                 filter="url(#shadow)" />
        <polygon points="20,30 50,0 50,30"
                 fill="#f8bb00"
                 filter="url(#glow)" />
    </g>
</svg>