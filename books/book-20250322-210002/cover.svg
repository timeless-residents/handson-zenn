<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 500 700">
    <defs>
        <linearGradient id="bgGradient"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%"
                  style="stop-color:#F5F5F5;stop-opacity:1" />
            <stop offset="100%"
                  style="stop-color:#E0E0E0;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect width="100%"
          height="100%"
          fill="url(#bgGradient)" />
    <g transform="translate(0, 50)">
        <text x="50%"
              y="150"
              text-anchor="middle"
              font-size="96"
              font-weight="bold"
              fill="#4CAF50"
              stroke="white"
              stroke-width="2"
              text-rendering="optimizeLegibility"
              font-family="sans-serif">
            <tspan x="50%"
                   dy="-1em">AI作曲の</tspan>
            <tspan x="50%"
                   dy="1em">羅針盤</tspan>
        </text>
        <text x="50%"
              y="230"
              text-anchor="middle"
              font-size="68"
              font-weight="bold"
              fill="#FF9800"
              stroke="white"
              stroke-width="1"
              text-rendering="optimizeLegibility"
              font-family=" sans-serif">
            <tspan x="50%"
                   dy="0em">MIDI</tspan>
            <tspan x="50%"
                   dy="1em">マエストロ</tspan>
            <tspan x="50%"
                   dy="1em">への道</tspan>
        </text>
        <text x="50%"
              y="380"
              text-anchor="middle"
              font-size="45"
              fill="#4CAF50"
              text-rendering="optimizeLegibility"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
            <tspan x="50%"
                   dy="1em">- 深層学習、</tspan>
            <tspan x="50%"
                   dy="1em">創造性、そして実践 -</tspan>
        </text>
        <path d="M 100 500 L 200 600 L 300 500 Z"
              fill="#4CAF50"
              stroke="white"
              stroke-width="2"
              transform="translate(50,0)" />
        <path d="M 300 600 L 400 500 L 500 600 Z"
              fill="#FF9800"
              stroke="white"
              stroke-width="2"
              transform="translate(-50,0)" />
    </g>
</svg>