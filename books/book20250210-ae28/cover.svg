<svg viewBox="0 0 500 700" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="500" height="700" fill="#f8f9fa"/>
<defs>
<linearGradient id="gradient" x1="0" y1="0" x2="500" y2="700" gradientUnits="userSpaceOnUse">
<stop stop-color="#007bff"/>
<stop offset="1" stop-color="#28a745"/>
</linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="4" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.3)"/>
      <feGaussianBlur stdDeviation="2" in="SourceAlpha" result="blur"/>
      <feOffset in="blur" dx="2" dy="2" result="offsetBlur"/>
      <feFlood flood-color="rgba(0,0,0,0.3)" flood-opacity="0.5" result="floodColor"/>
      <feComposite in="floodColor" in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
</defs>

<rect x="50" y="50" width="400" height="600" rx="20" fill="url(#gradient)" opacity="0.1"/>


<g filter="url(#shadow)">
    <text x="50%" y="150" text-anchor="middle" font-size="56" font-weight="bold" fill="#007bff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-rendering="optimizeLegibility" stroke="white" stroke-width="2">アプリケーション</text>
</g>
<g filter="url(#shadow)">
    <text x="50%" y="200" text-anchor="middle" font-size="56" font-weight="bold" fill="#007bff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-rendering="optimizeLegibility" stroke="white" stroke-width="2">パフォーマンス</text>
</g>
<g filter="url(#shadow)">
    <text x="50%" y="300" text-anchor="middle" font-size="106" font-weight="bold" fill="#007bff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-rendering="optimizeLegibility" stroke="white" stroke-width="2">最適化</text>
</g>


<g filter="url(#shadow)">
    <text x="50%" y="400" text-anchor="middle" font-size="98" font-weight="bold" fill="#28a745" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-rendering="optimizeLegibility" stroke="white" stroke-width="1">実践入門</text>
</g>

<g filter="url(#shadow)">
    <text x="50%" y="500" text-anchor="middle" font-size="48"  fill="#343a40" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-rendering="optimizeLegibility">問題解決から</text>
</g>
<g filter="url(#shadow)">
    <text x="50%" y="550" text-anchor="middle" font-size="48"  fill="#343a40" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-rendering="optimizeLegibility">高速化まで</text>
</g>

</svg>