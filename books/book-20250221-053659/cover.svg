<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 500 700">
    <rect width="500"
          height="700"
          fill="#311" />
    <defs>
        <linearGradient id="titleGradient"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%"
                  style="stop-color:#ffffff" />
            <stop offset="100%"
                  style="stop-color:#e2e8f0" />
        </linearGradient>
    </defs>
    <text x="250"
