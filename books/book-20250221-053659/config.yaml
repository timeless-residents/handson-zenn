title: "実践 Sitecore XM Cloud ハンズオン：Next.js & SXA によるモダンなWebサイト構築"
summary: |-
  本書は、Sitecore XM CloudとNext.js、SXAを用いてモダンなウェブサイトを構築するための実践的なハンズオン形式の技術書です。開発環境構築からコンポーネント開発、データ取得、多言語対応、パフォーマンスチューニング、セキュリティ対策まで、XM Cloudを活用したウェブサイト開発に必要な知識とスキルを網羅的に解説します。読者は本書を通じて、ヘッドレスCMSによる柔軟でスケーラブルなウェブサイト構築を習得し、最新のウェブ開発技術を効果的に活用できるようになります。

