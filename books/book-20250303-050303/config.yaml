title: "Hyperledger Fabric 実践開発：エンタープライズブロックチェーン構築の決定版"
summary: |-
  本書は、エンタープライズブロックチェーンの構築基盤であるHyperledger Fabricの実践的な開発手法を徹底解説します。ネットワーク構築、スマートコントラクト（チェーンコード）開発、API連携、運用管理、セキュリティ対策など、具体的なコード例や設定手順を通じて、Fabricを使いこなすための知識とスキルを身につけ、実際のビジネスアプリケーションに応用できる実践書となっています。

