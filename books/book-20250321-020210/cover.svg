<svg viewBox="0 0 500 700"
     xmlns="http://www.w3.org/2000/svg">
    <style>        
        .title {
        font-family:sans-serif;
        font-weight: bold;
        text-rendering: optimizeLegibility;
        fill: #007BFF;
        stroke: white;
        stroke-width: 2px;
        }
        .subtitle {
        font-family: sans-serif;
        font-weight: normal;
        text-rendering: optimizeLegibility;
        fill: #28A745;
        stroke: white;
        stroke-width: 1px;
        }
        .shadow {
        fill: rgba(0, 0, 0, 0.3);
        }
    </style>
    <rect width="100%"
          height="100%"
          fill="#F8F9FA" />
    <defs>
        <linearGradient id="bgGradient"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%">
            <stop offset="0%"
                  style="stop-color:#E9ECEF;stop-opacity:1" />
            <stop offset="100%"
                  style="stop-color:#F8F9FA;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect width="100%"
          height="100%"
          fill="url(#bgGradient)" />
    <g transform="translate(25, 25)">
        <text x="0"
              y="0"
              class="title"
              font-size="65">
            <tspan x="0"
                   font-size="1.2em"
                   dy="0.8em">量子</tspan>
            <tspan x="0"
                   dy="1.2em">コンピュータ</tspan>
            <tspan x="0"
                   dy="1em">今日から始める</tspan>
        </text>
        <text x="0"
              y="270"
              class="subtitle"
              font-size="50">
            <tspan x="0"
                   dy="0em">実務で役立つ</tspan>
            <tspan x="0"
                   dy="1em">量子アルゴリズム</tspan>
            <tspan x="0"
                   dy="1em">とクラウド活用</tspan>
        </text>
    </g>
    <path d="M250,400 L350,450 L250,500 L150,450 Z"
          fill="#007BFF"
          stroke="white"
          stroke-width="3" />
    <circle cx="250"
            cy="450"
            r="40"
            fill="#28A745"
            stroke="white"
            stroke-width="2" />
    <circle cx="250"
            cy="450"
            r="10"
            fill="white" />
    <path d="M250,550 L350,600 L250,650 L150,600 Z"
          fill="#007BFF"
          stroke="white"
          stroke-width="3" />
</svg>