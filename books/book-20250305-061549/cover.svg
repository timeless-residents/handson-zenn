<svg viewBox="0 0 500 700"
     xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%"
                  style="stop-color:#ecf0f1;stop-opacity:1" />
            <stop offset="100%"
                  style="stop-color:#d0d8e0;stop-opacity:1" />
        </linearGradient>
        <filter id="textShadow"
                x="-10%"
                y="-10%"
                width="120%"
                height="120%">
            <feDropShadow dx="2"
                          dy="2"
                          stdDeviation="3"
                          flood-color="#000"
                          flood-opacity="0.5" />
        </filter>
        <filter id="textOutline">
            <feMorphology operator="dilate"
                          radius="1"
                          in="SourceAlpha"
                          result="thicken" />
            <feFlood flood-color="#fff"
                     result="color" />
            <feComposite in="color"
                         in2="thicken"
                         operator="in"
                         result="coloredOutline" />
            <feMerge>
                <feMergeNode in="coloredOutline" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    <rect width="100%"
          height="100%"
          fill="url(#bgGradient)" />
    <g transform="translate(25, 50)">
        <text x="0"
              y="120"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="96"
              font-weight="bold"
              fill="#3498db"
              text-rendering="optimizeLegibility"
              filter="url(#textOutline)">
            <tspan x="0"
                   dy="0">Stable</tspan>
            <tspan x="0"
                   dy="110">Diffusion</tspan>
        </text>
        <text x="0"
              y="300"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="48"
              font-weight="bold"
              fill="#f39c12"
              text-rendering="optimizeLegibility"
              filter="url(#textOutline)">
            <tspan x="0"
                   dy="0">実践ガイド：</tspan>
        </text>
        <text x="0"
              y="380"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="36"
              font-weight="bold"
              fill="#34495e"
              text-rendering="optimizeLegibility">
            <tspan x="0"
                   dy="0"
                   filter="url(#textOutline)">プロンプト</tspan>
            <tspan x="0"
                   dy="40"
                   filter="url(#textOutline)">エンジニアリング、</tspan>
            <tspan x="0"
                   dy="40"
                   filter="url(#textOutline)">カスタマイズ、そして</tspan>
            <tspan x="0"
                   dy="40"
                   filter="url(#textOutline)">ビジネス活用</tspan>
        </text>
        <circle cx="400"
                cy="550"
                r="50"
                fill="#3498db"
                filter="url(#textShadow)" />
        <circle cx="100"
                cy="550"
                r="50"
                fill="#f39c12"
                filter="url(#textShadow)" />
    </g>
</svg>