<svg viewBox="0 0 500 700"
     xmlns="http://www.w3.org/2000/svg">
    <style>        
        .title {
        font-family:  sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: bold;
        text-rendering: optimizeLegibility;
        fill: #FFF;
        stroke: #333;
        stroke-width: 2px;
        }
        .subtitle {
        font-family:  sans-serif,  -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-rendering: optimizeLegibility;
        fill: #333;
        }
    </style>
    <rect width="100%"
          height="100%"
          fill="#F5F5F5" />
    <linearGradient id="bgGradient"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">
        <stop offset="0%"
              stop-color="#673AB7" />
        <stop offset="100%"
              stop-color="#00BCD4" />
    </linearGradient>
    <rect width="100%"
          height="100%"
          fill="url(#bgGradient)"
          opacity="0.2" />
    <text x="50%"
          y="150"
          text-anchor="middle"
          class="title"
          font-size="166">
        <tspan x="50%"
               dy="0em">Hono</tspan>
    </text>
    <text x="50%"
          y="240"
          text-anchor="middle"
          class="title"
          font-size="96">
        <tspan x="50%"
               dy="0em">&amp;</tspan>
    </text>
    <text x="50%"
          y="350"
          text-anchor="middle"
          class="title"
          font-size="136">
        <tspan x="50%"
               dy="0em">Stream</tspan>
    </text>
    <text x="50%"
          y="480"
          text-anchor="middle"
          class="title"
          font-size="166">
        <tspan x="50%"
               dy="0em">Deck</tspan>
    </text>
    <text x="50%"
          y="560"
          text-anchor="middle"
          class="subtitle"
          font-size="54">
        <tspan x="50%"
               dy="em">実践的 モダン</tspan>
        <tspan x="50%"
               dy="1em">開発ワークフロー</tspan>
        <tspan x="50%"
               dy="1em">構築術</tspan>
    </text>
</svg>