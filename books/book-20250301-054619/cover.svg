<svg viewBox="0 0 500 700"
     xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%"
                  style="stop-color:#f0f0f0;stop-opacity:1" />
            <stop offset="100%"
                  style="stop-color:#e0e0e0;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%">
            <feDropShadow dx="2"
                          dy="2"
                          stdDeviation="3"
                          flood-color="rgba(0,0,0,0.3)" />
        </filter>
        <filter id="glow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%">
            <feGaussianBlur stdDeviation="4"
                            result="coloredBlur" />
            <feMerge>
                <feMergeNode in="coloredBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    <rect width="100%"
          height="100%"
          fill="url(#bgGradient)" />
    <g transform="translate(25, 0)">
        <text x="0"
              y="120"
              font-family="sans-serif"
              font-size="100"
              font-weight="bold"
              fill="#3498db"
              text-rendering="optimizeLegibility"
              filter="shadow">
            <tspan x="0"
                   dy="0em"
                   stroke="white"
                   stroke-width="1.5"
                   filter="none">OpenAI</tspan>
            <tspan x="0"
                   dy="1.2em"
                   stroke="white"
                   stroke-width="1.5"
                   filter="none">Platform</tspan>
        </text>
        <text x="0"
              y="350"
              font-family="sans-serif"
              font-size="70"
              font-weight="bold"
              fill="#f39c12"
              text-rendering="optimizeLegibility"
              filter="shadow">
            <tspan x="0"
                   dy="0em"
                   stroke="white"
                   stroke-width="1"
                   filter="none">実践開発</tspan>
            <tspan x="0"
                   dy="1.2em"
                   stroke="white"
                   stroke-width="1"
                   filter="none">API活用から</tspan>
            <tspan x="0"
                   dy="1.2em"
                   stroke="white"
                   stroke-width="1"
                   filter="none">自社サービス</tspan>
            <tspan x="0"
                   dy="1.2em"
                   stroke="white"
                   stroke-width="1"
                   filter="none">構築まで</tspan>
        </text>
    </g>
    <g transform="translate(350, 550)">
        <path d="M20,0 L40,20 L35,25 L15,5 L10,10 L30,30 L25,35 L5,15 Z"
              fill="#3498db"
              filter="glow" />
        <path d="M0,20 L20,40 L25,35 L5,15 L10,10 L30,30 L35,25 L15,5 Z"
              fill="#f39c12"
              filter="glow" />
    </g>
</svg>