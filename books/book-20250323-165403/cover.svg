<svg viewBox="0 0 500 700"
     xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%">
            <stop offset="0%"
                  style="stop-color:#ecf0f1;stop-opacity:1" />
            <stop offset="100%"
                  style="stop-color:#d0d3d4;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow"
                x="-0.1"
                y="-0.1"
                width="1.2"
                height="1.2">
            <feGaussianBlur stdDeviation="3"
                            result="shadowBlur" />
            <feOffset dx="2"
                      dy="2"
                      in="shadowBlur"
                      result="shadowOffset" />
            <feMerge>
                <feMergeNode in="shadowOffset" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="outerGlow">
            <feGaussianBlur stdDeviation="5"
                            result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    <rect width="100%"
          height="100%"
          fill="url(#bgGradient)" />
    <g transform="translate(25, 50)">
        <text x="0"
              y="120"
              font-family="sans-serif"
              font-size="86"
              font-weight="bold"
              fill="#3498db"
              text-rendering="optimizeLegibility"
              filter="outerGlow">
            <tspan x="0"
                   dy="0">                
                エンジニア
            <tspan dx="-40"
                   font-size="0.5em">が</tspan>
        </tspan>
        <tspan x="0"
               dy="100">市場を制す</tspan>
    </text>
    <text x="0"
          y="300"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="48"
          font-weight="bold"
          fill="#f39c12"
          text-rendering="optimizeLegibility"
          filter="shadow">
        <tspan x="0"
               dy="0">技術戦略と</tspan>
        <tspan x="0"
               dy="50">ビジネス視点の融合</tspan>
    </text>
    <path d="M 50,400 C 150,450 350,450 450,400"
          stroke="#3498db"
          stroke-width="10"
          fill="none"
          stroke-linecap="round"
          filter="shadow" />
    <circle cx="50"
            cy="400"
            r="20"
            fill="#3498db"
            filter="shadow" />
    <circle cx="450"
            cy="400"
            r="20"
            fill="#f39c12"
            filter="shadow" />
    <rect x="50"
          y="500"
          width="400"
          height="150"
          rx="20"
          ry="20"
          fill="white"
          opacity="0.1"
          filter="shadow" />
    <text x="0"
          y="530"
          font-family="sans-serif"
          font-size="54"
          fill="#555"
          text-rendering="optimizeLegibility">
        <tspan x="0"
               dy="0">            
            中級エンジニア
        <tspan dx="-30"
               font-size="0.5em">向け</tspan>
    </tspan>
    <tspan x="0"
           dy="1em">解説書/実践ガイド</tspan>
</text>
</g>
</svg>