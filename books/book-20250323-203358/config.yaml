title: "開発生産性を爆上げ！経営と現場を繋ぐ「技術翻訳者」育成バイブル"
summary: |-
  本書は、デジタル変革時代に不可欠な「技術翻訳者」の育成を目的としています。技術と経営のギャップを埋め、組織全体の生産性向上に貢献するための知識、スキル、実践的な手法を網羅的に解説します。技術者と経営者の思考回路の理解から、コミュニケーション、ビジネススキル、ロードマップ作成、KPI設定、技術投資判断まで、幅広い領域をカバーします。

topics: 
  - DevOpsMetrics
  - 技術的負債
  - 技術ロードマップ
  - データドリブン
  - アジャイル組織

