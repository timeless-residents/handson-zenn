<svg viewBox="0 0 500 700"
     fill="none"
     xmlns="http://www.w3.org/2000/svg">
    <rect width="500"
          height="700"
          fill="#F8F9FA" />
    <defs>
        <linearGradient id="bgGradient"
                        x1="0"
                        y1="0"
                        x2="500"
                        y2="700"
                        gradientUnits="userSpaceOnUse">
            <stop stop-color="#E9ECEF" />
            <stop offset="1"
                  stop-color="#F8F9FA" />
        </linearGradient>
        <filter id="shadow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%"
                filterUnits="objectBoundingBox"
                primitiveUnits="userSpaceOnUse"
                color-interpolation-filters="sRGB">
            <feDropShadow dx="2"
                          dy="4"
                          stdDeviation="3"
                          flood-color="rgba(0, 0, 0, 0.3)" />
            <feComposite in="SourceGraphic"
                         in2="shadow"
                         operator="over" />
        </filter>
        <filter id="outerGlow"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%"
                filterUnits="objectBoundingBox"
                primitiveUnits="userSpaceOnUse"
                color-interpolation-filters="sRGB">
            <feGaussianBlur stdDeviation="3"
                            in="SourceAlpha"
                            result="blur" />
            <feComposite in="SourceGraphic"
                         in2="blur"
                         operator="over" />
        </filter>
    </defs>
    <rect width="500"
          height="700"
          fill="url(#bgGradient)" />
    <g transform="translate(10, 0)">
        <text x="250"
              y="150"
              text-anchor="middle"
              font-size="96"
              font-weight="bold"
              fill="#007BFF"
              font-family="sans-serif"
              text-rendering="optimizeLegibility"
              filter="filter: drop-shadow(2px 4px 6px black);">
            <tspan x="250"
                   dy="-1em"
                   font-size="0.6em"
                   fill="28A745"
                   stroke="black"
                   stroke-width="1"
                   filter="outerGlow">エンジニアリング</tspan>
            <tspan x="250"
                   dy="1em"
                   fill="#007BFF"
                   stroke="black"
                   stroke-width="1"
                   filter="outerGlow">主導の</tspan>
        </text>
        <text x="250"
              y="390"
              text-anchor="middle"
              font-size="96"
              font-weight="bold"
              fill="#28A745"
              font-family="sans-serif"
              text-rendering="optimizeLegibility"
              filter="filter: drop-shadow(2px 4px 6px black);">
            <tspan x="250"
                   dy="-1em"
                   fill="#28A745"
                   stroke="black"
                   stroke-width="1"
                   filter="outerGlow">経営変革</tspan>
        </text>
        <text x="250"
              y="400"
              text-anchor="middle"
              font-size="70"
              font-weight="bold"
              font-family=" sans-serif"
              text-rendering="optimizeLegibility"
              filter="filter: drop-shadow(2px 4px 6px black);">
            <tspan x="250"
                   dy="0em"
                   fill="#007bff"
                   stroke="black"
                   stroke-width="0.5"
                   filter="outerGlow">技術戦略で</tspan>
            <tspan x="250"
                   dy="1.2em"
                   fill="#007bff"
                   stroke="black"
                   stroke-width="0.5"
                   filter="outerGlow">未来を切り拓く</tspan>
        </text>
        <g transform="translate(50, 550)">
            <path d="M0 0 L100 0 L100 100 L0 100 Z"
                  fill="none"
                  stroke="#007BFF"
                  stroke-width="5" />
            <path d="M15 15 L85 15 L85 85 L15 85 Z"
                  fill="#007BFF" />
            <path d="M30 30 L70 30 L70 70 L30 70 Z"
                  fill="white" />
        </g>
        <g transform="translate(350, 550)">
            <path d="M0 0 L100 0 L100 100 L0 100 Z"
                  fill="none"
                  stroke="#28A745"
                  stroke-width="5" />
            <path d="M15 15 L85 15 L85 85 L15 85 Z"
                  fill="#28A745" />
            <path d="M30 30 L70 30 L70 70 L30 70 Z"
                  fill="white" />
        </g>
    </g>
</svg>