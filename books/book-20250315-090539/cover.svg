<svg viewBox="0 0 500 700"
     fill="none"
     xmlns="http://www.w3.org/2000/svg">
    <rect width="500"
          height="700"
          fill="#FFFFFF" />
    <defs>
        <filter id="shadow"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">
            <feDropShadow dx="4"
                          dy="4"
                          stdDeviation="4"
                          flood-color="rgba(0,0,0,0.3)" />
        </filter>
        <linearGradient id="gradient"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1">
            <stop offset="0%"
                  stop-color="#2980B9" />
            <stop offset="100%"
                  stop-color="#3498DB" />
        </linearGradient>
    </defs>
    <rect width="500"
          height="700"
          fill="url(#gradient)" />
    <g transform="translate(25, 50)">
        <text x="0"
              y="0"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="96"
              font-weight="bold"
              fill="white"
              text-rendering="optimizeLegibility"
              filter="url(#shadow)">
            <tspan x="0"
                   dy="96">Python</tspan>
        </text>
        <text x="0"
              y="100"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="96"
              font-weight="bold"
              fill="white"
              text-rendering="optimizeLegibility"
              filter="url(#shadow)">
            <tspan x="0"
                   dy="96">画像処理</tspan>
        </text>
        <text x="0"
              y="200"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="96"
              font-weight="bold"
              fill="white"
              text-rendering="optimizeLegibility"
              filter="url(#shadow)">
            <tspan x="0"
                   dy="96">ライブラリ</tspan>
        </text>
    </g>
    <g transform="translate(25, 380)">
        <text x="0"
              y="0"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="80"
              font-weight="bold"
              fill="#F1C40F"
              text-rendering="optimizeLegibility"
              filter="url(#shadow)">
            <tspan x="0"
                   dy="48">Pillowと</tspan>
        </text>
        <text x="0"
              y="70"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="80"
              font-weight="bold"
              fill="#F1C40F"
              text-rendering="optimizeLegibility"
              filter="url(#shadow)">
            <tspan x="0"
                   dy="48">Claude 3.7</tspan>
        </text>
        <text x="0"
              y="120"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="48"
              font-weight="bold"
              fill="#F1C40F"
              text-rendering="optimizeLegibility"
              filter="url(#shadow)">
            <tspan x="0"
                   dy="48"> AIで実現する</tspan>
        </text>
    </g>
    <g transform="translate(25, 580)">
        <text x="0"
              y="0"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="60"
              font-weight="bold"
              fill="white"
              text-rendering="optimizeLegibility"
              filter="url(#shadow)">
            <tspan x="0"
                   dy="36">高度画像分析入門</tspan>
        </text>
    </g>
</svg>