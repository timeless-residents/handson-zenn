<svg viewBox="0 0 500 700"
     xmlns="http://www.w3.org/2000/svg">
    <style>        
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@700&amp;display=swap');
    </style>
    <rect width="100%"
          height="100%"
          fill="#f8f9fa" />
    <defs>
        <linearGradient id="bgGradient"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%"
                  style="stop-color:#e9ecef;stop-opacity:1" />
            <stop offset="100%"
                  style="stop-color:#f8f9fa;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="bgGradient2"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%"
                  style="stop-color:#e9ecef;stop-opacity:1" />
            <stop offset="100%"
                  style="stop-color:#f8f9fa;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="bgGradient3"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%"
                  style="stop-color:#e9ecef;stop-opacity:1" />
            <stop offset="100%"
                  style="stop-color:#f8f9fa;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%">
            <feDropShadow dx="4"
                          dy="4"
                          stdDeviation="4"
                          flood-color="#000"
                          flood-opacity="0.2" />
        </filter>
        <filter id="outerGlow">
            <feGaussianBlur in="SourceAlpha"
                            stdDeviation="4" />
            <feOffset dx="0"
                      dy="0"
                      result="offsetblur" />
            <feFlood flood-color="#007bff" />
            <feComposite in2="offsetblur"
                         operator="in" />
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    <rect width="100%"
          height="100%"
          fill="url(#bgGradient)" />
    <g transform="translate(25, 0)">
        <text x="0"
              y="0"
              font-family="Roboto, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="104"
              font-weight="bold"
              fill="#007bff"
              text-rendering="optimizeLegibility"
              filter="shadow">
            <tspan x="0"
                   dy="1.2em">画像を</tspan>
            <tspan x="0"
                   dy="1.2em">言葉にする</tspan>
        </text>
        <text x="0"
              y="270"
              font-family="Roboto, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="56"
              font-weight="bold"
              fill="#007bff"
              text-rendering="optimizeLegibility"
              filter="shadow">
            <tspan x="0"
                   dy="1.2em">技術革命</tspan>
        </text>
        <text x="0"
              y="350"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="50"
              font-weight="bold"
              fill="#28a745"
              text-rendering="optimizeLegibility"
              filter="shadow">
            <tspan x="0"
                   dy="1.2em">実務で活かす</tspan>
            <tspan x="0"
                   dy="1.2em">最先端</tspan>
            <tspan x="0"
                   dy="1.2em">キャプショニング</tspan>
        </text>
    </g>
    <g transform="translate(350, 550)"
       filter="outerGlow">
        <path d="M25 0 L50 43.3 L43.3 50 L0 25 L43.3 0 Z"
              fill="url(#bgGradient2)" />
        <path d="M25 0 L50 43.3 L43.3 50 L0 25 L43.3 0 Z"
              fill="url(#bgGradient2)" />
        <path d="M25 0 L50 43.3 L43.3 50 L0 25 L43.3 0 Z"
              fill="url(#bgGradient2)" />
    </g>
    <g transform="translate(50, 550)"
       filter="outerGlow">
        <path d="M25 0 L50 43.3 L43.3 50 L0 25 L43.3 0 Z"
              fill="url(#bgGradient3)" />
        <path d="M25 0 L50 43.3 L43.3 50 L0 25 L43.3 0 Z"
              fill="url(#bgGradient3)" />
        <path d="M25 0 L50 43.3 L43.3 50 L0 25 L43.3 0 Z"
              fill="url(#bgGradient3)" />
    </g>
</svg>