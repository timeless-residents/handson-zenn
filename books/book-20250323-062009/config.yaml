title: "サイバー攻撃、AIで迎え撃つ！ 自律型脅威ハンター育成バイブル"
summary: |-
  本書は、AIを活用した自律型脅威分析エージェントの開発と運用を解説し、最新のサイバー攻撃に対抗するための実践的な知識とスキルを提供します。脅威インテリジェンス、機械学習、深層学習、自然言語処理、グラフ分析などの技術を組み合わせ、データ収集からインシデント対応までの一連のプロセスを網羅します。読者は本書を通じて、自律的に脅威を検知・分析し、迅速に対応できるセキュリティ体制を構築するためのノウハウを習得できます。

