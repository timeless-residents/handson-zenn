<svg viewBox="0 0 500 700"
     fill="none"
     xmlns="http://www.w3.org/2000/svg">
    <rect width="500"
          height="700"
          fill="#f8f9fa" />
    <defs>
        <filter id="shadow"
                x="-10%"
                y="-10%"
                width="120%"
                height="120%"
                filterUnits="objectBoundingBox"
                primitiveUnits="userSpaceOnUse">
            <feDropShadow dx="0"
                          dy="4"
                          stdDeviation="4"
                          flood-color="rgba(0,0,0,0.25)" />
        </filter>
        <linearGradient id="gradient"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1">
            <stop offset="0%"
                  stop-color="#007bff" />
            <stop offset="100%"
                  stop-color="#28a745" />
        </linearGradient>
    </defs>
    <rect x="50"
          y="50"
          width="400"
          height="600"
          rx="15"
          fill="url(#gradient)"
          opacity="0.1" />
    <g filter="url(#shadow)">
        <text x="50%"
              y="150"
              dominant-baseline="central"
              text-anchor="middle"
              font-family=" sans-serif"
              font-size="70"
              font-weight="bold"
              text-rendering="optimizeLegibility"
              fill="white"
              stroke="black"
              stroke-width="2">
            <tspan x="50%"
                   dy="0em"
                   style="text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);">サイバー攻撃、</tspan>
            <tspan x="50%"
                   dy="1em"
                   style="text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);">AIで迎え撃つ！</tspan>
        </text>
        <text x="50%"
              y="300"
              dominant-baseline="central"
              text-anchor="middle"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="48"
              font-weight="bold"
              text-rendering="optimizeLegibility"
              fill="white"
              stroke="black"
              stroke-width="1">
            <tspan x="50%"
                   dy="1em"
                   style="text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);">自律型脅威ハンター</tspan>
            <tspan x="50%"
                   dy="1em"
                   style="text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);">育成バイブル</tspan>
        </text>
    </g>
    <path d="M100 450 C 150 500, 350 500, 400 450"
          stroke="#007bff"
          stroke-width="4"
          stroke-linecap="round" />
    <circle cx="100"
            cy="450"
            r="10"
            fill="#28a745" />
    <circle cx="400"
            cy="450"
            r="10"
            fill="#28a745" />
    <path d="M150 500 L 200 550 L 250 500 L 300 550 L 350 500"
          stroke="#007bff"
          stroke-width="3"
          fill="none" />
    <rect x="175"
          y="600"
          width="150"
          height="40"
          rx="20"
          fill="#007bff"
          opacity="0.2" />
</svg>