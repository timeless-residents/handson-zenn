<svg viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F9FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E9ECEF;stop-opacity:1" />
    </linearGradient>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feMerge>
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGradient)" />

  <g transform="translate(25, 0)">
    <text x="0" y="100" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="bold" fill="#007BFF" text-rendering="optimizeLegibility" filter="url(#textShadow)">
      次世代
    </text>
    <text x="0" y="200" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="80" font-weight="bold" fill="#007BFF" text-rendering="optimizeLegibility" filter="url(#textShadow)" lengthAdjust="spacingAndGlyphs" >
      テクノロジー
    </text>
    <text x="0" y="300" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="bold" fill="#007BFF" text-rendering="optimizeLegibility" filter="url(#textShadow )">
      スタック
    </text>

    <text x="0" y="420" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="bold" fill="#28A745" text-rendering="optimizeLegibility" filter="url(#textShadow)">
      構築術
    </text>
    <text x="0" y="500" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="70" font-weight="normal" fill="#343A40" text-rendering="optimizeLegibility" filter="url(#textShadow)" textLength="450">
      スケーラブルで
    </text>
    <text x="0" y="560" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="55" font-weight="normal" fill="#343A40" text-rendering="optimizeLegibility" filter="url(#textShadow)" >
      インテリジェントな
    </text>
    <text x="0" y="650" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="80" font-weight="normal" fill="#343A40" text-rendering="optimizeLegibility" filter="url(#textShadow)">
      アプリ開発
    </text>

    <rect x="350" y="600" width="100" height="75" fill="#FFFFFF" opacity="0.1"/>
  </g>
</svg>