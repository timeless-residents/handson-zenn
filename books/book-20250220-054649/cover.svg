<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700">
  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: bold;
      text-rendering: optimizeLegibility;
      fill: #007BFF;
      stroke: white;
      stroke-width: 2;
      paint-order: stroke fill;
    }

    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: bold;
      text-rendering: optimizeLegibility;
      fill: #28A745;
      stroke: white;
      stroke-width: 1;
      paint-order: stroke fill;
    }

    .background {
      fill: #F8F9FA;
    }

    .gradient {
      fill: url(#gradient);
    }
  </style>

  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E9ECEF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CED4DA;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect class="background" width="500" height="700" />
  <rect class="gradient" width="500" height="700"/>

  <text x="250" y="150" text-anchor="middle" class="title" font-size="72">
    <tspan x="250" dy="-1em">実践！</tspan>
    <tspan x="250" dy="1em">プログレッシブ</tspan>
  </text>

  <text x="250" y="250" text-anchor="middle" class="title" font-size="72">
    <tspan x="250" dy="0.7em">AIエージェント</tspan>
    <tspan x="250" dy="1em">開発</tspan>
  </text>

  <text x="250" y="400" text-anchor="middle" class="subtitle" font-size="48">
    <tspan x="250" dy="0.5em">LlamaIndex,</tspan>
    <tspan x="250" dy="1em">BabyAGI, </tspan>
    <tspan x="250" dy="1em">そして評価まで</tspan>
  </text>

  <!-- AIアイコン (仮) -->
  <path d="M250,550 L300,650 L200,650 Z" fill="#007BFF" stroke="white" stroke-width="2"/>
</svg>