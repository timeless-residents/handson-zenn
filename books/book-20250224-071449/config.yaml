title: "実践Three.js：Webクリエイティブを極める"
summary: |-
  本書は、JavaScriptライブラリThree.jsを用いて、Webブラウザ上で高度な3D表現を実現するための実践的な技術を解説します。基本的な要素から、シェーダー、物理エンジン、VR/ARまで幅広いトピックを扱い、読者は創造的なWebクリエイティブを開発できるようになります。サンプルコードと豊富な図解を通して、Three.jsの理解を深め、Webクリエイティブの可能性を広げます。

topics: 
  - ThreeJS
  - WebGL
  - GLSL
  - WebXR
  - Blender

