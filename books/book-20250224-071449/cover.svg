<svg viewBox="0 0 500 700"
     fill="none"
     xmlns="http://www.w3.org/2000/svg">
    <!-- 背景 -->
    <rect width="500"
          height="700"
          fill="#EDEFF1" />
    <!-- 影フィルター -->
    <defs>
        <filter id="shadow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%">
            <feDropShadow dx="3"
                          dy="3"
                          stdDeviation="4"
                          flood-color="rgba(0,0,0,0.15)" />
        </filter>
    </defs>
    <!-- 円形要素 -->
    <circle cx="420"
            cy="560"
            r="60"
            fill="#34C759"
            filter="url(#shadow)" />
    <circle cx="80"
            cy="620"
            r="40"
            fill="#1A73E8"
            filter="url(#shadow)" />
    <!-- 三角形パス -->
    <path d="M120 80 L 220 180 L 320 80 Z"
          fill="none"
          stroke="#34C759"
          stroke-width="40"
          stroke-linecap="round"
          filter="url(#shadow)" />
    <!-- テキストグループ -->
    <g transform="translate(30, 60)">
        <text x="0"
              y="250"
              font-size="100"
              font-weight="700"
              fill="#1A73E8"
              text-rendering="optimizeLegibility"
              style="font-family: 'M PLUS 1p', sans-serif;">
            <tspan x="0"
                   dy="0em"
                   stroke="white"
                   stroke-width="1.5"
                   filter="url(#shadow)">Three.js</tspan>
        </text>
        <text x="0"
              y="340"
              font-size="68"
              font-weight="600"
              fill="#1A73E8"
              text-rendering="optimizeLegibility"
              style="font-family: 'M PLUS 1p', sans-serif;">
            <tspan x="0"
                   dy="0em"
                   stroke="white"
                   stroke-width="1.5"
                   filter="url(#shadow)">Web</tspan>
            <tspan x="0"
                   dy="1.2em"
                   font-size="0.8em"
                   stroke="white"
                   stroke-width="1.5"
                   filter="url(#shadow)">クリエイティブを</tspan>
            <tspan x="0"
                   dy="1.2em"
                   stroke="white"
                   stroke-width="1.5"
                   filter="url(#shadow)">極める</tspan>
        </text>
    </g>
    <!-- グラデーションオーバーレイ -->
    <linearGradient id="bgGradient"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">
        <stop offset="0%"
              style="stop-color:#EDEFF1;stop-opacity:0.7" />
        <stop offset="100%"
              style="stop-color:#FFFFFF;stop-opacity:0.3" />
    </linearGradient>
    <rect width="500"
          height="700"
          fill="url(#bgGradient)" />
</svg>