title: "脱・お絵描き！ Python Turtleで「使える」ビジュアルプログラミング - データ可視化、ゲーム開発、そして実務へ"
summary: |-
  本書はPythonのTurtle Graphicsを、教育用ツールから実用的なプログラミングスキル獲得の手段へと進化させることを目指します。データ可視化、ゲーム開発、GUIプログラミングなど、幅広い応用例を通じて、読者はPythonの基礎から応用までを習得できます。最終的には、実務で役立つプログラミング能力を身につけることが可能です。

topics: 
  - TurtleGraphics
  - Tkinter
  - Pygame
  - WebAssembly
  - DataVisualization

