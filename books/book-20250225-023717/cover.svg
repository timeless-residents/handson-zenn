<svg viewBox="0 0 500 700"
     fill="none"
     xmlns="http://www.w3.org/2000/svg">
    <rect width="500"
          height="700"
          fill="#F5F5F5" />
    <defs>
        <filter id="shadow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%"
                filterUnits="objectBoundingBox"
                primitiveUnits="userSpaceOnUse">
            <feDropShadow dx="3"
                          dy="3"
                          stdDeviation="5"
                          flood-color="rgba(0,0,0,0.3)" />
        </filter>
        <linearGradient id="gradient"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1">
            <stop offset="0%"
                  stop-color="#448AFF" />
            <stop offset="100%"
                  stop-color="#FF4081" />
        </linearGradient>
    </defs>
    <rect width="500"
          height="700"
          fill="url(#gradient)"
          opacity="0.1" />
    <path d="M400 100 L450 150 L400 200 Z"
          fill="#448AFF"
          opacity="0.8" />
    <path d="M100 500 L50 450 L100 400 Z"
          fill="#FF4081"
          opacity="0.8" />
    <g font-family="sans-serif"
       font-weight="bold"
       text-rendering="optimizeLegibility">
        <text x="0"
              y="20"
              font-size="120"
              fill="white"
              stroke="black"
              stroke-width="2"
              filter="url(#shadow)">
            <tspan x="20"
                   dy="0.9em">Three.js</tspan>
        </text>
        <text x="50"
              y="200"
              font-size="130"
              fill="#333"
              stroke="white"
              stroke-width="1">
            <tspan x="20"
                   dy="0.9em">WebGL</tspan>
        </text>
        <text x="50"
              y="350"
              font-size="55"
              fill="#333"
              stroke="white"
              stroke-width="1">
            <tspan x="20"
                   dy="0.9em">インタラクティブ</tspan>
            <tspan x="20"
                   dy="1.2em"
                   font-size="1.5em">3Dワールド</tspan>
            <tspan x="20"
                   dy="1.2em"
                   font-size="1.6em">構築ガイド</tspan>
        </text>
    </g>
</svg>