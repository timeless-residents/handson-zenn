title: "現場で役立つ！ESP32ではじめる実践IoT開発：環境構築からデータ分析、ビジネス活用まで"
summary: |-
  本書は、IoT開発の入門から実践までをESP32を用いて解説します。環境構築、センサー連携、クラウド連携、データ可視化、省電力化、セキュリティ対策など、広範な技術要素を網羅し、具体的な事例を通じてビジネス活用までを視野に入れます。読者は、ESP32を用いたIoTシステム開発に必要な知識とスキルを習得し、実際にIoTプロジェクトを立ち上げられるようになります。

topics: 
  - ESP32
  - ArduinoIDE
  - AWSIoTCore
  - MQTT
  - Grafana

