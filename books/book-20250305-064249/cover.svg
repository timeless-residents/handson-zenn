<svg viewBox="0 0 500 700"
     xmlns="http://www.w3.org/2000/svg">
    <style>        
        text {
        font-family: sans-serif;
        text-rendering: optimizeLegibility;
        }
        .title {
        font-size: 55px;
        font-weight: bold;
        fill: #fff;
        stroke: #000;
        stroke-width: 2;
        }
        .subtitle {
        font-size: 40px;
        font-weight: bold;
        fill: #fff;
        stroke: #000;
        stroke-width: 1;
        }
    </style>
    <rect width="100%"
          height="100%"
          fill="#F5F5F5" />
    <defs>
        <linearGradient id="bgGradient"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%">
            <stop offset="0%"
                  style="stop-color:#2E7D32;stop-opacity:1" />
            <stop offset="100%"
                  style="stop-color:#1B5E20;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%">
            <feDropShadow dx="4"
                          dy="4"
                          stdDeviation="4"
                          flood-color="rgba(0,0,0,0.5)" />
        </filter>
    </defs>
    <rect width="100%"
          height="70%"
          fill="url(#bgGradient)"
          filter="url(#shadow)" />
    <g transform="translate(25, 0)">
        <text x="0"
              y="80"
              class="title">
            <tspan x="0"
                   dy="0em">現場で役立つ！</tspan>
        </text>
        <text x="0"
              y="160"
              class="title">
            <tspan x="0"
                   dy="0em">ESP32ではじめる</tspan>
        </text>
        <text x="0"
              y="240"
              class="title">
            <tspan x="0"
                   dy="0em">実践IoT開発</tspan>
        </text>
        <text x="0"
              y="350"
              class="subtitle">
            <tspan x="0"
                   dy="0em">環境構築からデータ分析</tspan>
            <tspan x="0"
                   dy="1.2em">ビジネス活用まで</tspan>
        </text>
    </g>
    <image x="50"
           y="480"
           width="150"
           height="150"
           href="data:image/png;base64," />
    <path d="M350,550 l-50,50 l20,0 l0,50 l50,-50 L380,580 z"
          fill="#FFB300"
          filter="url(#shadow)" />
    <path d="M400,550 l-50,50 l20,0 l0,50 l50,-50 L430,580 z"
          fill="#FFB300"
          filter="url(#shadow)" />
</svg>