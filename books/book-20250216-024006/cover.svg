<svg viewBox="0 0 500 700"
     xmlns="http://www.w3.org/2000/svg">
    <style>        
        .title {
        font-family: sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: bold;
        text-rendering: optimizeLegibility;
        fill: #fff;
        stroke: #000;
        stroke-width: 2px;
        }
        .subtitle {
        font-family: sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: bold;
        text-rendering: optimizeLegibility;
        fill: #28a745;
        stroke: #fff;
        stroke-width: 1px;
        }
    </style>
    <rect width="100%"
          height="100%"
          fill="#f8f9fa" />
    <defs>
        <linearGradient id="bgGradient"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%"
                  style="stop-color:#007bff;stop-opacity:0.2" />
            <stop offset="100%"
                  style="stop-color:#fff;stop-opacity:0.1" />
        </linearGradient>
    </defs>
    <rect width="100%"
          height="100%"
          fill="url(#bgGradient)" />
    <g transform="translate(25, 0)">
        <text class="title"
              x="0"
              y="10"
              font-size="96"
              fill="#fff"
              stroke="#000"
              stroke-width="3">
            <tspan x="0"
                   dy="0.9em">API統合</tspan>
        </text>
        <text class="title"
              x="0"
              y="100"
              font-size="96"
              fill="#fff"
              stroke="#000"
              stroke-width="3">
            <tspan x="0"
                   dy="0.9em">実践</tspan>
        </text>
        <text class="title"
              x="0"
              y="200"
              font-size="76"
              fill="#fff"
              stroke="#000"
              stroke-width="3">
            <tspan x="0"
                   dy="0.9em">ハンドブック</tspan>
        </text>
        <text class="subtitle"
              x="0"
              y="350"
              font-size="60"
              fill="#28a745"
              stroke="#fff"
              stroke-width="1">
            <tspan x="0"
                   dy="0em">2025</tspan>
            <tspan x="0"
                   dy="1em">現場で即使える</tspan>
        </text>
        <text class="subtitle"
              x="0"
              y="420"
              font-size="80"
              fill="#28a745"
              stroke="#fff"
              stroke-width="1">
            <tspan x="0"
                   dy="1em">最強ガイド</tspan>
        </text>
    </g>
    <path d="M 350 550 L 450 650 L 350 650 Z"
          fill="#28a745"
          stroke="#fff"
          stroke-width="2" />
    <path d="M 350 650 L 250 550 L 250 650 Z"
          fill="#007bff"
          stroke="#fff"
          stroke-width="2" />
</svg>