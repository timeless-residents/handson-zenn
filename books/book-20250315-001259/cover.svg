<svg viewBox="0 0 500 700"
     xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="shadow"
                x="-10%"
                y="-10%"
                width="120%"
                height="120%">
            <feDropShadow dx="2"
                          dy="2"
                          stdDeviation="3"
                          flood-color="rgba(0,0,0,0.4)" />
        </filter>
        <linearGradient id="bgGradient"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%"
                  stop-color="#F8F9FA" />
            <stop offset="100%"
                  stop-color="#FFFFFF" />
        </linearGradient>
    </defs>
    <rect width="100%"
          height="100%"
          fill="url(#bgGradient)" />
    <rect width="100%"
          height="100%"
          fill="rgba(255,255,255,0.1)"
          style="mix-blend-mode:overlay" />
    <g transform="translate(25,100)">
        <text x="0"
              y="0"
              font-family="sans-serif"
              font-size="115"
              font-weight="bold"
              fill="#00C73E"
              text-rendering="optimizeLegibility"
              style="stroke: white; stroke-width: 2px; filter: url(#shadow);">
            <tspan x="0"
                   dy="0">LINE</tspan>
            <tspan x="0"
                   dy="1em">WORKS</tspan>
        </text>
        <text x="0"
              y="100"
              font-family=" sans-serif"
              font-size="96"
              font-weight="bold"
              fill="#4285F4"
              text-rendering="optimizeLegibility"
              style="stroke: white; stroke-width: 2px; filter: url(#shadow);">
            <tspan x="0"
                   dy="100">×</tspan>
        </text>
        <text x="0"
              y="200"
              font-family=" sans-serif"
              font-size="85"
              font-weight="bold"
              fill="#4285F4"
              text-rendering="optimizeLegibility"
              style="stroke: white; stroke-width: 2px; filter: url(#shadow);">
            <tspan x="0"
                   dy="100">Claude 3.7</tspan>
        </text>
        <text x="0"
              y="330"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="36"
              font-weight="bold"
              fill="#333"
              text-rendering="optimizeLegibility">
            <tspan x="0"
                   dy="40"
                   style="stroke: white; stroke-width: 0.5px; filter: url(#shadow);">AIパワーでビジネスチャットを</tspan>
            <tspan x="0"
                   dy="40"
                   style="stroke: white; stroke-width: 0.5px; filter: url(#shadow);">劇的に変える実践ガイド</tspan>
        </text>
        <text x="0"
              y="480"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="45"
              fill="#666"
              text-rendering="optimizeLegibility">
            <tspan x="0"
                   dy="0">業務効率最大化</tspan>
            <tspan x="0"
                   dy="1em">顧客体験革新</tspan>
            <tspan x="0"
                   dy="1em">未来型コラボレーション</tspan>
        </text>
    </g>
</svg>