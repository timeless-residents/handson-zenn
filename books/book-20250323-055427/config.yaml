title: "AIが蘇らせる！ドット絵リバイバル: ジェネレーティブAIでレトロゲーム風キャラクターを量産する魔法"
summary: |-
  本書は、ジェネレーティブAIを用いてレトロゲーム風のドット絵キャラクターを効率的に作成する方法を解説します。環境構築からプロンプトエンジニアリング、LoRA/Dreamboothによる独自モデルの作成、そしてゲームエンジンへの組み込みまで、幅広い技術を網羅。読者はAIを活用して、オリジナルのレトロゲーム風キャラクターやアセットを量産し、ゲーム開発やNFTアートに活用できるようになります。

