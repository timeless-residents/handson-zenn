title: "未来を実装する: 2025年からのコンピューティング・パラダイムシフト 実践ガイド"
summary: |-
  本書は、量子コンピューティング、エッジコンピューティング、ニューロモーフィックコンピューティングなど、次世代のコンピューティング技術の基礎から実践までを網羅的に解説します。各技術の原理、開発環境構築、具体的な応用事例、セキュリティ対策までをカバーし、読者が未来のコンピューティングパラダイムを理解し、実際に開発に携わるための知識とスキルを提供します。理論だけでなく、実際にコードを書いて動かすことを重視した実践的なガイドです。

topics: 
  - 量子コンピューティング
  - エッジコンピューティング
  - ニューロモーフィックコンピューティング
  - サーバーレス
  - デジタルツイン

