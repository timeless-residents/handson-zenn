<svg viewBox="0 0 500 700"
     xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="gradient"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%"
                  style="stop-color:#FFFFFF;stop-opacity:1" />
            <stop offset="100%"
                  style="stop-color:#EEEEEE;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect width="100%"
          height="100%"
          fill="url(#gradient)" />
    <g transform="translate(25, 25)">
        <text x="0"
              y="0"
              font-family="sans-serif"
              font-size="100"
              font-weight="bold"
              fill="#10A37F"
              stroke="white"
              stroke-width="2"
              text-rendering="optimizeLegibility">
            <tspan x="0"
                   dy="0.9em">OpenAI</tspan>
            <tspan x="0"
                   font-size="0.8em"
                   dy="1em">Responses</tspan>
            <tspan x="0"
                   dy="1em">API</tspan>
        </text>
        <text x="0"
              y="330"
              font-family="sans-serif"
              font-size="70"
              font-weight="bold"
              fill="#000000"
              stroke="white"
              stroke-width="1"
              text-rendering="optimizeLegibility">
            <tspan x="0"
                   dy="0.9em">完全マスター</tspan>
            <tspan x="0"
                   dy="0.9em">実践ガイド</tspan>
        </text>
    </g>
    <g transform="translate(350, 550)">
        <circle cx="0"
                cy="0"
                r="40"
                fill="#10A37F" />
        <circle cx="80"
                cy="0"
                r="40"
                fill="#000000" />
        <circle cx="40"
                cy="70"
                r="40"
                fill="#10A37F" />
    </g>
    <g transform="translate(100,550)">
        <path d="M10 0 L40 0 L45 10 L45 30 L40 40 L10 40 L5 30 L5 10 Z"
              fill="#000000"
              stroke="white"
              stroke-width="2"
              transform="scale(1.5)" />
    </g>
</svg>