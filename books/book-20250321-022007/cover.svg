<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 500 700">
    <defs>
        <linearGradient id="bgGradient"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%"
                  style="stop-color:#f8f9fa;stop-opacity:1" />
            <stop offset="100%"
                  style="stop-color:#e9ecef;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect width="500"
          height="700"
          fill="url(#bgGradient)" />
    <g transform="translate(25,50)">
        <text x="0"
              y="120"
              font-family=" sans-serif"
              font-size="96"
              font-weight="bold"
              fill="#007bff"
              text-rendering="optimizeLegibility"
              stroke="white"
              stroke-width="2">
            <tspan x="0"
                   dy="0.9em">金融RPA</tspan>
        </text>
        <text x="0"
              y="230"
              font-family=" sans-serif"
              font-size="96"
              font-weight="bold"
