title: "金融RPA 実践ガイド：自動化戦略、実装、リスク管理、そして未来"
summary: |-
  本書は、金融機関におけるRPA（ロボティック・プロセス・オートメーション）の導入から運用までを網羅的に解説する実践ガイドです。RPAの基礎知識、導入戦略、ツール選定、開発、運用、セキュリティ、ガバナンスに加え、AIやOCRとの連携、最新トレンド、将来展望まで、金融RPAに関する幅広い技術と概念を扱います。読者は本書を通じて、金融機関におけるRPA導入・推進に必要な知識とスキルを習得し、自動化による業務効率化、コスト削減、リスク管理、顧客体験向上を実現できます。

topics: 
  - UiPath
  - AutomationAnywhere
  - BluePrism
  - プロセスマイニング
  - 金融コンプライアンス

