title: "Scratch進化論：ゲーム開発からAI、そして未来の創造へ"
summary: |-
  本書は、Scratchの基礎から応用までを網羅し、ゲーム開発、物理エンジン、AI、データサイエンスなど、幅広い分野での活用法を解説します。読者はScratchを通じてプログラミングの基礎を習得し、高度な技術を学び、創造的なプロジェクトを開発する力を身につけられます。さらに、WebAssemblyやブロックチェーンなどの最新技術との連携や、テキストベースプログラミングへの移行も視野に入れた内容で、Scratchを入り口とした未来の創造へと導きます。

