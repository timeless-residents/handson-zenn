title: "英語学習を「攻略」する技術：TOEIC/TOEFL/IELTSメタ学習戦略大全"
summary: |-
  本書は、TOEIC、TOEFL、IELTSといった英語試験のスコアアップを目指す学習者に向けて、メタ学習戦略を体系的に解説する。自己分析から目標設定、効果的な学習法、教材選定、AI活用、モチベーション維持まで網羅し、試験対策だけでなく、継続的な英語学習を習慣化するための技術を提供する。読者は、自身の学習スタイルに合わせた「攻略ルート」を見つけ、効率的に目標スコアを達成できる。

topics: 
  - SMART目標設定
  - メタ学習
  - シャドーイング
  - オンライン英会話
  - ChatGPT

