<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 500 700">
    <rect width="500"
          height="700"
          fill="#F5F5DC" />
    <defs>
        <linearGradient id="titleGradient"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1">
            <stop offset="0%"
                  stop-color="white" />
            <stop offset="100%"
                  stop-color="#e2e8f0" />
        </linearGradient>
    </defs>
    <text x="250"
          y="120"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="48"
          font-weight="bold"
          text-anchor="middle"
          dominant-baseline="middle">
        <tspan x="250"
               font-size="2em"
               dy="0em">英語学習を</tspan>
        <tspan x="250"
               font-size="1.5em"
               dy="1em">攻略する技術</tspan>
        <tspan x="250"
               dy="3em">TOEIC/TOEFL/IELTS</tspan>
        <tspan x="250"
               font-size="2em"
               dy="1em">メタ学習</tspan>
        <tspan x="250"
               font-size="2em"
               dy="1em">戦略大全</tspan>
    </text>
</svg>