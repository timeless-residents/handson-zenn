title: "忍者の網膜記憶術をAIで再現する ── Legacy DX：伝統知をデジタルで蘇らせる"
summary: |-
  伊賀に伝わる忍者の網膜瞬間記憶術。「メモを残せば死ぬ」時代に生まれたこの技術は、なぜ現代人の記憶力を遥かに超えるのか。
  
  本書は、忍者の情報収集・記憶・実行の三層構造を現代認知科学で解釈し、AIトレーニングアプリとして実装するまでの全工程を解説します。
  生存と記憶が結びついたとき、脳は限界を超える——その原理をコードで再現します。
  
  Legacy DX（伝統技術のデジタル変革）という新しい視点で、失われかけた身体知をAI時代に蘇らせる実践的な技術書です。

topics:
