title: "数字と友達になる！ データ活用スキル革命 - 意思決定を加速するテクニカル分析実践講座"
summary: |-
  本書は、データ活用スキルを網羅的に習得し、ビジネスにおける意思決定を加速させることを目的としています。統計の基礎から機械学習、時系列分析、地理空間分析、因果推論、自然言語処理、画像認識といった幅広い技術を解説し、Tableau、Power BI、Python、SQLといったツールを駆使した実践的なデータ分析手法を習得します。読者はデータに基づいた問題解決能力を身につけ、ビジネスの現場でデータドリブンな意思決定を推進できるようになります。

topics: 
  - Webスクレイピング
  - 時系列分析
  - クラスタリング
  - Tableau
  - 因果推論

