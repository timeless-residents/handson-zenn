<svg viewBox="0 0 500 700"
     xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%"
                  style="stop-color:#f8f9fa;stop-opacity:1" />
            <stop offset="100%"
                  style="stop-color:#e9ecef;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect width="100%"
          height="100%"
          fill="url(#bgGradient)" />
    <g transform="translate(0, 50)">
        <text x="50%"
              y="150"
              text-anchor="middle"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="96"
              font-weight="bold"
              fill="#007bff"
              text-rendering="optimizeLegibility"
              stroke="white"
              stroke-width="2"
              paint-order="stroke">
            <tspan x="50%"
                   dy="-1em">音声認識</tspan>
        </text>
        <text x="50%"
              y="240"
              text-anchor="middle"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="96"
              font-weight="bold"
              fill="#007bff"
              text-rendering="optimizeLegibility"
              stroke="white"
              stroke-width="2"
              paint-order="stroke">
            <tspan x="50%"
                   dy="-1em">開発ガイド</tspan>
        </text>
        <text x="50%"
              y="240"
              text-anchor="middle"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="80"
              fill="#28a745"
              text-rendering="optimizeLegibility"
              stroke="white"
              stroke-width="1"
              paint-order="stroke">
            <tspan x="50%"
                   dy="0em">Whisper &amp; </tspan>
            <tspan x="50%"
                   dy="1em">最新技術で</tspan>
            <tspan x="50%"
                   dy="1em">実現する</tspan>
            <tspan x="50%"
                   dy="1em">リアルタイム</tspan>
            <tspan x="50%"
                   dy="1em">音声処理</tspan>
        </text>
        <path d="M150,50 L200,100 L300,100 L350,50 L300,0 L200,0 Z"
              fill="#007bff"
              transform="translate(75,600) scale(0.5)" />
        <path d="M150,50 L200,100 L300,100 L350,50 L300,0 L200,0 Z"
              fill="#28a745"
              transform="translate(275,600) scale(0.5)" />
    </g>
