title: "スケーラブルMMOゲーム開発：Node.js & WebSocket 実践ガイド - リアルタイム通信、ゲームロジック、パフォーマンス最適化"
summary: |-
  本書は、Node.jsとWebSocketを用いてスケーラブルなMMOゲームを開発するための実践的なガイドです。リアルタイム通信、ゲームロジック、パフォーマンス最適化、セキュリティ対策など、MMOゲーム開発に必要な幅広い技術と概念を網羅しています。読者は、本書を通して、MMOゲーム開発の基礎から応用までを習得し、独自のMMOワールドを創造する力を得られます。

topics: 
  - NodeJS
  - WebSocket
  - MongoDB
  - HTML5Canvas
  - EventDrivenArchitecture

