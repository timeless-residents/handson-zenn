<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 500 700">
    <defs>
        <linearGradient id="bgGradient"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%"
                  style="stop-color:#F8F9FA;stop-opacity:1" />
            <stop offset="100%"
                  style="stop-color:#E9ECEF;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect width="500"
          height="700"
          fill="url(#bgGradient)" />
    <circle cx="100"
            cy="100"
            r="40"
            fill="#007BFF"
            opacity="0.1" />
    <circle cx="400"
            cy="600"
            r="60"
            fill="#28A745"
            opacity="0.1" />
    <rect x="200"
          y="300"
          width="80"
          height="80"
          fill="#007BFF"
          opacity="0.1"
          rx="10"
          ry="10" />
    <text x="250"
          y="250"
          text-anchor="middle"
          fill="#007BFF"
          font-size="96"
          font-weight="bold"
          text-rendering="optimizeLegibility"
          font-family="sans-serif">
        <tspan x="250"
               dy="-1.1em"
               stroke="white"
               font-size="0.8em"
               stroke-width="2px">スマート空間</tspan>
        <tspan x="250"
               dy="1.1em"
               stroke="white"
               stroke-width="2px">デザイン</tspan>
    </text>
    <text x="250"
          y="400"
          text-anchor="middle"
          fill="#28A745"
          font-size="44"
          font-weight="bold"
          text-rendering="optimizeLegibility"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
        <tspan x="250"
               dy="1.5em"
               stroke="white"
               stroke-width="1px">フィジカルとデジタルが</tspan>
        <tspan x="250"
               dy="1.2em"
               stroke="white"
               stroke-width="1px">織りなす未来</tspan>
    </text>
    <text x="250"
          y="650"
          text-anchor="middle"
          fill="#6C757D"
          font-size="36"
          text-rendering="optimizeLegibility"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
        <tspan x="250"
               dy="0.5em"
               stroke="white"
               stroke-width="0.5px">IoT | 空間情報 | デザイン</tspan>
    </text>
</svg>