<svg viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F9FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E9ECEF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="whiteStroke" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="white" flood-opacity="1" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGradient)" />

  <g transform="translate(25, 50)">
    <text x="0" y="120" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="bold" fill="#007BFF" text-rendering="optimizeLegibility" filter="whiteStroke">
      <tspan x="0" dy="0">コードで</tspan>
    </text>
    <text x="0" y="210" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="bold" fill="#007BFF" text-rendering="optimizeLegibility" filter="whiteStroke">
      <tspan x="0" dy="0">解き明かす</tspan>
    </text>
    <text x="0" y="300" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="bold" fill="#007BFF" text-rendering="optimizeLegibility" filter="whiteStroke">
      <tspan x="0" dy="0">ビジネス戦略</tspan>
    </text>

    <text x="0" y="420" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="normal" fill="#28A745" text-rendering="optimizeLegibility" filter="shadow">
      <tspan x="0" dy="0">実践的データドリブン経営</tspan>
    </text>
  </g>

  <path d="M450,600 L480,630 L450,660 Z" fill="#28A745" transform="translate(-10, -10)" filter="shadow"/>
  <circle cx="50" cy="600" r="20" fill="#007BFF" filter="shadow"/>
  <circle cx="150" cy="650" r="20" fill="#007BFF" filter="shadow"/>
  <circle cx="250" cy="600" r="20" fill="#007BFF" filter="shadow"/>
  <circle cx="350" cy="650" r="20" fill="#007BFF" filter="shadow"/>

</svg>