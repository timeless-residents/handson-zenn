<svg viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#F0F3F4"/>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="20" x2="20" y2="0" stroke="#E5E8E9" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="20" y2="20" stroke="#E5E8E9" stroke-width="0.5"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <g transform="translate(25, 50)">
    <text x="0" y="0" font-size="76" font-weight="bold" text-rendering="optimizeLegibility" fill="#2E86C1" style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
     <tspan x="0" dy="80" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.2);">実践！</tspan>
    </text>
    <text x="0" y="80" font-size="64" font-weight="bold" text-rendering="optimizeLegibility" fill="#2E86C1" style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      <tspan x="0" dy="80" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.2);">Hammerspoon</tspan>
    </text>
    <text x="0" y="160" font-size="76" font-weight="bold" text-rendering="optimizeLegibility" fill="#2E86C1" style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      <tspan x="0" dy="80" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.2);">と Claudeで</tspan>
    </text>
    <text x="0" y="250" font-size="82" font-weight="bold" text-rendering="optimizeLegibility" fill="#2E86C1" style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
     <tspan x="0" dy="60" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.2);">Mac自動化</tspan>
    </text>
      <text x="0" y="350" font-size="80" text-rendering="optimizeLegibility" fill="#F39C12" style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; filter:url(#shadow);">
      <tspan x="0" dy="40">業務効率化の</tspan>
      <tspan x="0" dy="80">最前線</tspan>
    </text>
  </g>
  <g transform="translate(380, 580)">
    <circle cx="0" cy="0" r="15" fill="#F39C12" filter="url(#shadow)"/>
    <path d="M-8,0 L 0,-10 L 8,0 L 0,10 Z" fill="#F0F3F4" filter="url(#shadow)"/>
    <path d="M-8,0 L 0, 10 L 8,0 L 0,-10 Z" fill="#F39C12" stroke="#fff" stroke-width="0.5" filter="url(#shadow)"/>
  </g>
 <g transform="translate(40, 560)">
    <circle cx="0" cy="0" r="15" fill="#F39C12" filter="url(#shadow)"/>
    <path d="M-8,0 L 0,-10 L 8,0 L 0,10 Z" fill="#F0F3F4" filter="url(#shadow)"/>
    <path d="M-8,0 L 0, 10 L 8,0 L 0,-10 Z" fill="#F39C12" stroke="#fff" stroke-width="0.5" filter="url(#shadow)"/>
  </g>
    <g transform="translate(200, 620)">
    <circle cx="0" cy="0" r="15" fill="#F39C12" filter="url(#shadow)"/>
    <path d="M-8,0 L 0,-10 L 8,0 L 0,10 Z" fill="#F0F3F4" filter="url(#shadow)"/>
    <path d="M-8,0 L 0, 10 L 8,0 L 0,-10 Z" fill="#F39C12" stroke="#fff" stroke-width="0.5" filter="url(#shadow)"/>
  </g>
</svg>