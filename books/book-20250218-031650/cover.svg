<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 500 700">
    <rect width="500"
          height="700"
          fill="#f5f5f5" />
    <defs>
        <linearGradient id="titleGradient"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1">
            <stop offset="0%"
                  stop-color="#4a5568" />
            <stop offset="100%"
                  stop-color="#2d3748" />
        </linearGradient>
        <linearGradient id="highlightGradient"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1">
            <stop offset="0%"
                  stop-color="#4299e1" />
            <stop offset="100%"
                  stop-color="#3182ce" />
        </linearGradient>
        <filter id="glow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%">
            <feGaussianBlur stdDeviation="4"
                            result="blur" />
            <feComposite in="SourceGraphic"
                         in2="blur"
                         operator="over" />
        </filter>
    </defs>
    <!-- Decorative elements - blockchain nodes and connections -->
    <g opacity="0.2">
        <circle cx="100"
                cy="50"
                r="8"
                fill="#4299e1" />
        <circle cx="180"
                cy="80"
                r="8"
                fill="#4299e1" />
        <circle cx="250"
                cy="30"
                r="8"
                fill="#4299e1" />
        <circle cx="320"
                cy="70"
                r="8"
                fill="#4299e1" />
        <circle cx="400"
                cy="40"
                r="8"
                fill="#4299e1" />
        <line x1="100"
              y1="50"
              x2="180"
              y2="80"
              stroke="#4299e1"
              stroke-width="2" />
        <line x1="180"
              y1="80"
              x2="250"
              y2="30"
              stroke="#4299e1"
              stroke-width="2" />
        <line x1="250"
              y1="30"
              x2="320"
              y2="70"
              stroke="#4299e1"
              stroke-width="2" />
        <line x1="320"
              y1="70"
              x2="400"
              y2="40"
              stroke="#4299e1"
              stroke-width="2" />
    </g>
    <!-- Main title with animated glow -->
    <text x="250"
          y="140"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="150"
          font-weight="bold"
          fill="url(#titleGradient)"
          text-anchor="middle"
          dominant-baseline="middle"
          filter="url(#glow)">STO</text>
    <text x="250"
          y="240"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="88"
          font-weight="bold"
          fill="url(#titleGradient)"
          text-anchor="middle"
          dominant-baseline="middle">構築ガイド</text>
    <!-- Special highlight for Foundry -->
    <text x="250"
          y="340"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="106"
          font-weight="bold"
          fill="url(#highlightGradient)"
          text-anchor="middle"
          dominant-baseline="middle">Foundry</text>
    <text x="250"
          y="400"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="36"
          font-weight="bold"
          fill="url(#titleGradient)"
          text-anchor="middle"
          dominant-baseline="middle">&amp; </text>
    <text x="250"
          y="460"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="86"
          font-weight="bold"
          fill="url(#titleGradient)"
          text-anchor="middle"
          dominant-baseline="middle">Solidity</text>
    <text x="250"
          y="550"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="36"
          font-weight="bold"
          fill="url(#titleGradient)"
          text-anchor="middle"
          dominant-baseline="middle">次世代</text>
    <text x="250"
          y="600"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="46"
          font-weight="bold"
          fill="url(#titleGradient)"
          text-anchor="middle"
          dominant-baseline="middle">セキュリティトークン</text>
    <text x="250"
          y="650"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="36"
          font-weight="bold"
          fill="url(#titleGradient)"
          text-anchor="middle"
          dominant-baseline="middle">開発</text>
    <!-- Token symbol with shine effect -->
    <g transform="translate(440, 60) rotate(15)">
        <circle cx="0"
                cy="0"
                r="40"
                fill="#d69e2e"
                stroke="#f6e05e"
                stroke-width="2" />
        <text x="0"
              y="0"
              font-family="monospace"
              font-size="16"
              font-weight="bold"
              fill="white"
              text-anchor="middle"
              dominant-baseline="middle">$STO</text>
    </g>
</svg>