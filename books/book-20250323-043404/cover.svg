<svg viewBox="0 0 500 700"
     xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%"
                  style="stop-color:#FFFFFF;stop-opacity:1" />
            <stop offset="100%"
                  style="stop-color:#F0F0F0;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow"
                x="-0.1"
                y="-0.1"
                width="1.2"
                height="1.2">
            <feDropShadow dx="2"
                          dy="2"
                          stdDeviation="3"
                          flood-color="rgba(0, 0, 0, 0.5)" />
        </filter>
        <filter id="glow">
            <feGaussianBlur stdDeviation="3"
                            result="glow" />
            <feMerge>
                <feMergeNode in="glow" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    <rect width="100%"
          height="100%"
          fill="url(#bgGradient)" />
    <circle cx="100"
            cy="600"
            r="40"
            fill="#FFFF00"
            filter="glow" />
    <circle cx="400"
            cy="100"
            r="50"
            fill="#FF4500"
            filter="glow" />
    <circle cx="250"
            cy="350"
            r="60"
            fill="rgba(255,69,0,0.5)"
            filter="glow" />
    <g font-family="sans-serif"
       font-weight="bold"
       text-rendering="optimizeLegibility">
        <text x="250"
              y="150"
              font-size="72"
              fill="#FFFFFF"
              text-anchor="middle"
              filter="shadow">
            <tspan x="250"
                   dy="0em"
                   stroke="#000000"
                   stroke-width="2">炎上覚悟の</tspan>
        </text>
        <text x="250"
              y="250"
              font-size="72"
              fill="#FFFFFF"
              text-anchor="middle"
              filter="shadow">
            <tspan x="250"
                   dy="0em"
                   stroke="#000000"
                   stroke-width="2">時短術！</tspan>
        </text>
        <text x="250"
              y="400"
              font-size="64"
              fill="#FFFF00"
              text-anchor="middle"
              filter="shadow">
            <tspan x="250"
                   dy="0em"
                   stroke="#000000"
                   stroke-width="1">AI動画で</tspan>
        </text>
        <text x="250"
              y="500"
              font-size="64"
              fill="#FFFF00"
              text-anchor="middle"
              filter="shadow">
            <tspan x="250"
                   dy="0em"
                   stroke="#000000"
                   stroke-width="1">コンテンツ</tspan>
        </text>
        <text x="250"
              y="600"
              font-size="64"
              fill="#FFFF00"
              text-anchor="middle"
              filter="shadow">
            <tspan x="250"
                   dy="0em"
                   stroke="#000000"
                   stroke-width="1">地獄から脱出</tspan>
        </text>
    </g>
</svg>