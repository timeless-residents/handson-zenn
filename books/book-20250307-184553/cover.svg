<svg viewBox="0 0 500 700"
     xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%"
                  style="stop-color:#f6f8fa;stop-opacity:1" />
            <stop offset="100%"
                  style="stop-color:#e9ecef;stop-opacity:1" />
        </linearGradient>
        <filter id="textOutline">
            <feGaussianBlur in="SourceAlpha"
                            stdDeviation="2" />
            <feOffset dx="0"
                      dy="0"
                      result="offsetblur" />
            <feFlood flood-color="#24292e" />
            <feComposite in2="offsetblur"
                         operator="in" />
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="dropShadow">
            <feDropShadow dx="2"
                          dy="2"
                          stdDeviation="2"
                          flood-color="#000000"
                          flood-opacity="0.2" />
        </filter>
    </defs>
    <rect width="100%"
          height="100%"
          fill="url(#bgGradient)" />
    <g transform="translate(25, 50)">
        <text x="0"
              y="0"
              font-size="96"
              font-weight="bold"
              fill="#2ea44f"
              text-rendering="optimizeLegibility"
              style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;"
              filter="textOutline">
            <tspan x="0"
                   dy="0.9em">GitHub</tspan>
            <tspan x="0"
                   dy="1.1em">Actionsで</tspan>
        </text>
        <text x="0"
              y="220"
              font-size="76"
              font-weight="bold"
              fill="#24292e"
              text-rendering="optimizeLegibility"
              style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;"
              filter="dropShadow">
            <tspan x="0"
                   dy="0.9em">爆速リリース</tspan>
        </text>
        <text x="0"
              y="320"
              font-size="80"
              font-weight="bold"
              fill="#24292e"
              text-rendering="optimizeLegibility"
              style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;"
              filter="dropShadow">
            <tspan x="0"
                   dy="0.9em">PyInstaller</tspan>
            <tspan x="0"
                   dy="1.1em">&amp; DMGbuild</tspan>
        </text>
        <text x="0"
              y="520"
              font-size="45"
              font-weight="normal"
              fill="#24292e"
              text-rendering="optimizeLegibility"
              style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;"
              filter="dropShadow">
            <tspan x="0"
                   dy="0.9em">実践 macOS</tspan>
            <tspan x="0"
                   dy="1.1em">アプリ開発入門</tspan>
        </text>
    </g>
</svg>