<svg viewBox="0 0 500 700"
     xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%">
            <stop offset="0%"
                  stop-color="#F5F5F5" />
            <stop offset="100%"
                  stop-color="#EEEEEE" />
        </linearGradient>
        <filter id="shadow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%">
            <feGaussianBlur in="SourceAlpha"
                            stdDeviation="3" />
            <feOffset dx="2"
                      dy="2"
                      result="offsetblur" />
            <feMerge>
                <feMergeNode in="offsetblur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="outline">
            <feMorphology operator="dilate"
                          radius="1"
                          in="SourceAlpha"
                          result="thicken" />
            <feFlood flood-color="white"
                     result="flood" />
            <feComposite in="flood"
                         in2="thicken"
                         operator="in" />
            <feMerge>
                <feMergeNode in="flood" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    <rect width="100%"
          height="100%"
          fill="url(#bgGradient)" />
    <g transform="translate(25, 50)">
        <text x="0"
              y="0"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="96"
              font-weight="bold"
              fill="#2196F3"
              text-rendering="optimizeLegibility">
            <tspan x="0"
                   dy="96">AI生成</tspan>
            <tspan x="0"
                   dy="106">Platform</tspan>
            <tspan x="0"
                   dy="106">SaaS</tspan>
        </text>
    </g>
    <g transform="translate(25, 400)">
        <text x="0"
              y="0"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="36"
              font-weight="bold"
              fill="#FF5722"
              text-rendering="optimizeLegibility"
              filter="outline">
            <tspan x="0"
                   dy="40">爆速構築！</tspan>
        </text>
    </g>
    <g transform="translate(25, 470)">
        <text x="0"
              y="0"
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="24"
              fill="#333"
              text-rendering="optimizeLegibility">
            <tspan x="0"
                   dy="30">1人で1日で作る、</tspan>
            <tspan x="0"
                   dy="30">スケール可能なAIサービス</tspan>
            <tspan x="0"
                   dy="30">立ち上げ完全ガイド</tspan>
        </text>
    </g>
    <g transform="translate(350, 550)"
       fill="#2196F3">
        <path d="M50 25 L70 0 L90 25 L70 50 Z" />
        <path d="M50 35 L60 20 L70 35 Z" />
        <path d="M50 35 L80 35 L70 20 Z" />
        <path d="M50 35 L80 35 L70 50 Z" />
        <path d="M50 35 L60 50 L70 35 Z" />
    </g>
    <g transform="translate(150, 550)"
       fill="#FF5722">
        <path d="M50 25 L70 0 L90 25 L70 50 Z" />
        <path d="M50 35 L60 20 L70 35 Z" />
        <path d="M50 35 L80 35 L70 20 Z" />
        <path d="M50 35 L80 35 L70 50 Z" />
        <path d="M50 35 L60 50 L70 35 Z" />
    </g>
</svg>