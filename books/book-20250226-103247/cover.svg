<svg viewBox="0 0 500 700"
     xmlns="http://www.w3.org/2000/svg">
    <style>        
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@700&amp;display=swap');
    </style>
    <rect width="100%"
          height="100%"
          fill="#ecf0f1" />
    <defs>
        <filter id="textShadow"
                x="-100%"
                y="-100%"
                width="300%"
                height="300%">
            <feDropShadow dx="2"
                          dy="2"
                          stdDeviation="3"
                          flood-color="rgba(0,0,0,0.5)" />
        </filter>
    </defs>
    <g transform="translate(0, 50)">
        <text x="250"
              y="50"
              text-anchor="middle"
              font-size="80"
              font-family="sans-serif"
              font-weight="bold"
              fill="#3498db"
              text-rendering="optimizeLegibility"
              filter="url(#textShadow)">
            <tspan x="250"
                   dy="0em">Programing</tspan>
            <tspan x="250"
                   dy="1.2em">パラダイム</tspan>
            <tspan x="250"
                   dy="1.2em">シフト</tspan>
        </text>
        <text x="250"
              y="320"
              text-anchor="middle"
              font-size="60"
              font-family="Roboto, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              fill="#f39c12"
              text-rendering="optimizeLegibility"
              filter="url(#textShadow)">
            <tspan x="250"
                   dy="0em">レガシーコードを</tspan>
            <tspan x="250"
                   dy="1.2em">モダンに進化させる</tspan>
            <tspan x="250"
                   dy="1.2em">実践ガイド</tspan>
        </text>
        <g transform="translate(250, 550)">
            <path d="M-50,-50 L50,-50 L50,50 L-50,50 Z"
                  fill="#3498db"
                  opacity="0.2" />
            <path d="M-30,-30 L30,-30 L30,30 L-30,30 Z"
                  fill="#f39c12"
                  opacity="0.2" />
        </g>
        <rect x="50"
              y="610"
              width="400"
              height="30"
              rx="25"
              fill="#FFFFFF"
              stroke="#3498db"
              stroke-width="3" />
        <text x="250"
              y="624"
              text-anchor="middle"
              font-size="24"
              font-family="Roboto, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              fill="#3498db"
              text-rendering="optimizeLegibility"
              font-weight="bold">
            <tspan x="250"
                   dy="0.4em">中級者向け</tspan>
        </text>
    </g>
</svg>