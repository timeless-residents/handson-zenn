<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700">
  <rect width="100%" height="100%" fill="#F8F9FA" />
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9900;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#007BFF;stop-opacity:0.3" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
     <filter id="whiteEdge">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilate"/>
      <feFlood flood-color="white" result="flood"/>
      <feComposite in="flood" in2="dilate" operator="in" result="composite"/>
      <feMerge>
         <feMergeNode in="composite" />
         <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#gradient)" />


  <g transform="translate(20, 50)">
   <text x="250" y="100" font-size="96" font-weight="bold" text-anchor="middle"  fill="#FF9900"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-rendering="optimizeLegibility" filter="whiteEdge">
     <tspan x="250" dy="0em">実践！</tspan>
    </text>

    <text x="250" y="200" font-size="80" font-weight="bold" text-anchor="middle"  fill="#FF9900"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-rendering="optimizeLegibility" filter="whiteEdge">
        <tspan x="230" dy="0em">AWS Lambda</tspan>
    </text>

    <text x="250" y="300" font-size="80" font-weight="bold" text-anchor="middle"  fill="#FF9900"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-rendering="optimizeLegibility" filter="whiteEdge">
        <tspan x="230" dy="0em">通知システム</tspan>
    </text>


  <text x="250" y="380" font-size="48" font-weight="bold" text-anchor="middle" fill="#007BFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-rendering="optimizeLegibility" filter="shadow" >
    <tspan x="250" dy="0.5em">構築：設計から</tspan>
     </text>
  <text x="250" y="430" font-size="48" font-weight="bold" text-anchor="middle" fill="#007BFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-rendering="optimizeLegibility" filter="shadow">
    <tspan x="250" dy="0.5em">運用、トラブル</tspan>
  </text>
   <text x="250" y="480" font-size="48" font-weight="bold" text-anchor="middle" fill="#007BFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-rendering="optimizeLegibility" filter="shadow">
        <tspan x="250" dy="0.5em">シューティングまで</tspan>
    </text>

 </g>
