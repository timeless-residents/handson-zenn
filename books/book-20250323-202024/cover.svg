<svg viewBox="0 0 500 700"
     xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%">
            <stop offset="0%"
                  style="stop-color:#f5f5f5;stop-opacity:1" />
            <stop offset="100%"
                  style="stop-color:#e0e0e0;stop-opacity:1" />
        </linearGradient>
        <filter id="textShadow"
                x="-0.2"
                y="-0.2"
                width="1.4"
                height="1.4">
            <feGaussianBlur in="SourceAlpha"
                            stdDeviation="1.5" />
            <feOffset dx="1"
                      dy="1"
                      result="offsetblur" />
            <feMerge>
                <feMergeNode in="offsetblur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="outerGlow"
                x="-0.5"
                y="-0.5"
                width="2"
                height="2">
            <feGaussianBlur stdDeviation="3"
                            result="blur" />
            <feFlood flood-color="#3498db"
                     flood-opacity="0.5" />
            <feComposite in2="blur"
                         operator="in" />
            <feComposite in="SourceGraphic" />
        </filter>
    </defs>
    <rect width="100%"
          height="100%"
          fill="url(#bgGradient)" />
    <g transform="translate(25, 0)">
        <text x="0"
              y="120"
              font-size="96"
              font-weight="bold"
              fill="#2ecc71"
              text-rendering="optimizeLegibility"
              style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;"
              filter="textShadow">
            <tspan x="0"
                   dy="0em">開発者の</tspan>
            <tspan x="0"
                   dy="1.1em">ための</tspan>
        </text>
        <text x="0"
              y="340"
              font-size="96"
              font-weight="bold"
              fill="#2ecc71"
              text-rendering="optimizeLegibility"
              style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;"
              filter="textShadow">
            <tspan x="0"
                   dy="0em">爆速</tspan>
        </text>
        <text x="0"
              y="440"
              font-size="96"
              font-weight="bold"
              fill="#2ecc71"
              text-rendering="optimizeLegibility"
              style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;"
              filter="textShadow">
            <tspan x="0"
                   dy="0em">グロース</tspan>
            <tspan x="0"
                   dy="1em">ハック</tspan>
        </text>
        <text x="0"
              y="580"
              font-size="32"
              font-weight="bold"
              fill="#3498db"
              text-rendering="optimizeLegibility"
              style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;"
              filter="outerGlow">
            <tspan x="0"
                   dy="0em">コードで実現する</tspan>
            <tspan x="0"
                   dy="1.2em">データドリブンマーケティング</tspan>
        </text>
    </g>
    <circle cx="450"
            cy="650"
            r="30"
            fill="#2ecc71" />
    <rect x="430"
          y="630"
          width="40"
          height="40"
          fill="#3498db" />
</svg>