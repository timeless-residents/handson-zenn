<svg viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ecf0f1"/>

  <defs>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
    <filter id="outline">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="thicken"/>
      <feFlood flood-color="white" result="color"/>
      <feComposite in="color" in2="thicken" operator="in" result="coloredOutline"/>
      <feMerge>
        <feMergeNode in="coloredOutline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#gradient)" />

  <linearGradient id="gradient" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#3498db"/>
    <stop offset="100%" stop-color="#2980b9"/>
  </linearGradient>

  <g transform="translate(0, 50)" text-rendering="optimizeLegibility" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="250" y="150" text-anchor="middle" font-size="96" font-weight="bold" fill="white" filter="outline">
      <tspan x="250" dy="-20">音声分析の</tspan>
      <tspan x="250" dy="100">自動化革命</tspan>
    </text>

    <text x="250" y="350" text-anchor="middle" font-size="48" font-weight="bold" fill="#f39c12" filter="outline">
      <tspan x="250">Praatスクリプトで</tspan>
      <tspan x="250" dy="50">実現するプロの技</tspan>
    </text>
  </g>

  <g transform="translate(50, 450)">
    <path d="M 50,50 L 100,100 L 150,50 L 200,100 L 250,50 L 300,100 L 350,50" stroke="white" stroke-width="5" fill="none" filter="shadow"/>
  </g>

  <g transform="translate(150, 550)">
    <rect width="200" height="50" fill="rgba(255,255,255,0.7)" rx="10" filter="shadow"/>
    <text x="250" y="580" text-anchor="middle" font-size="24" font-weight="bold" fill="#3498db">中級者向け</text>
  </g>

</svg>