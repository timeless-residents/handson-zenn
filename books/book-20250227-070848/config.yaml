title: "ホームラボ進化論：自宅サーバーで学ぶ、実践インフラエンジニアリング"
summary: |-
  本書は自宅サーバー（ホームラボ）の構築を通じて、インフラエンジニアリングの実践的な知識とスキルを習得することを目的としています。Ubuntu Server、Docker、Kubernetes、Terraformなど幅広い技術を扱い、Webサーバー、データベース、ネットワークストレージ、CI/CDパイプライン構築などを解説します。読者は本書を通じて、自宅環境で様々なインフラ技術を試せるようになり、キャリアアップやスキルアップに繋げることができます。

topics: 
