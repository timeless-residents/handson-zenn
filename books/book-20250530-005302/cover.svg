<svg width="1000"
     height="1400"
     viewBox="0 0 1000 1400"
     xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- PNG化対応のシンプルグラデーション -->
        <linearGradient id="bgGradient"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%"
                  style="stop-color:#F8F9FA" />
            <stop offset="50%"
                  style="stop-color:#E9ECEF" />
            <stop offset="100%"
                  style="stop-color:#DEE2E6" />
        </linearGradient>
        <!-- レーザー用グラデーション -->
        <radialGradient id="laserGradient">
            <stop offset="0%"
                  style="stop-color:#FF6B6B" />
            <stop offset="50%"
                  style="stop-color:#FF0000" />
            <stop offset="100%"
                  style="stop-color:#CC0000" />
        </radialGradient>
        <!-- PNG対応の影効果 -->
        <filter id="dropShadow"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">
            <feDropShadow dx="4"
                          dy="4"
                          stdDeviation="3"
                          flood-color="#000000"
                          flood-opacity="0.3" />
        </filter>
        <!-- グロー効果 -->
        <filter id="glow"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">
            <feGaussianBlur stdDeviation="6"
                            result="coloredBlur" />
            <feMerge>
                <feMergeNode in="coloredBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    <!-- 背景 -->
    <rect width="100%"
          height="100%"
          fill="url(#bgGradient)" />
    <!-- 技術的背景パターン（PNG対応） -->
    <g opacity="0.1">
        <circle cx="160"
                cy="200"
                r="6"
                fill="#007BFF" />
        <circle cx="840"
                cy="300"
                r="4"
                fill="#28A745" />
        <circle cx="120"
                cy="1200"
                r="4"
                fill="#FFC107" />
        <circle cx="880"
                cy="1160"
                r="6"
                fill="#DC3545" />
        <circle cx="200"
                cy="800"
                r="3"
                fill="#6F42C1" />
        <circle cx="800"
                cy="600"
                r="5"
                fill="#20C997" />
    </g>
    <!-- 境界線 -->
    <rect x="20"
          y="20"
          width="960"
          height="1360"
          fill="none"
          stroke="#007BFF"
          stroke-width="4"
          opacity="0.3"
          rx="10" />
    <!-- 上部タイトル部分 -->
    <rect x="60"
          y="60"
          width="880"
          height="300"
          fill="#FFFFFF"
          opacity="0.8"
          rx="15"
          filter="url(#dropShadow)" />
    <!-- メインタイトル -->
    <text x="500"
          y="140"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="80"
          font-weight="bold"
          fill="#2C3E50"
          filter="url(#dropShadow)">        
        ホンビノスメモリアル
    </text>
    <!-- サブタイトル -->
    <text x="500"
          y="230"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="62"
          font-weight="600"
          fill="#34495E">        
        生命体記録技術の完全ガイド
    </text>
    <!-- 技術的権威 -->
    <text x="500"
          y="310"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="50"
          font-weight="500"
          fill="#7F8C8D">        
        世界初 × 災害超越 × 1000年保存
    </text>
    <!-- 中央のレーザー装置 -->
    <g transform="translate(500,500)">
        <!-- 外枠 -->
        <rect x="-80"
              y="-80"
              width="160"
              height="160"
              fill="#2C3E50"
              rx="10" />
        <rect x="-70"
              y="-70"
              width="140"
              height="140"
              fill="#34495E"
              rx="8" />
        <!-- レーザー本体 -->
        <circle cx="0"
                cy="0"
                r="50"
                fill="url(#laserGradient)"
                filter="url(#glow)" />
        <circle cx="0"
                cy="0"
                r="40"
                fill="#FF0000" />
        <circle cx="0"
                cy="0"
                r="30"
                fill="#FF6B6B" />
        <!-- 照準システム -->
        <circle cx="0"
                cy="0"
                r="16"
                fill="none"
                stroke="#00FF00"
                stroke-width="3" />
        <line x1="-24"
              y1="0"
              x2="24"
              y2="0"
              stroke="#00FF00"
              stroke-width="2" />
        <line x1="0"
              y1="-24"
              x2="0"
              y2="24"
              stroke="#00FF00"
              stroke-width="2" />
        <!-- コントロールパネル表示 -->
        <rect x="-60"
              y="90"
              width="120"
              height="30"
              fill="#000000"
              rx="5" />
        <text x="0"
              y="110"
              text-anchor="middle"
              font-family="Arial, sans-serif"
              font-size="14"
              fill="#00FF00">            
            LASER ACTIVE
        </text>
    </g>
    <!-- メインコンテンツタイトル -->
    <text x="500"
          y="750"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="84"
          font-weight="bold"
          fill="#E74C3C"
          stroke="#FFFFFF"
          stroke-width="2"
          filter="url(#dropShadow)">        
        サンプルコード完全解説
    </text>
    <text x="500"
          y="850"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="72"
          font-weight="bold"
          fill="#C0392B"
          stroke="#FFFFFF"
          stroke-width="2"
          filter="url(#dropShadow)">        
        レーザー制御システム
    </text>
    <!-- 技術スタック -->
    <text x="500"
          y="920"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="44"
          font-weight="500"
          fill="#2C3E50">        
        Python × ハードウェア制御 × 材料科学
    </text>
    <!-- 権威性アピール -->
    <rect x="60"
          y="970"
          width="880"
          height="200"
          fill="#F8F9FA"
          stroke="#007BFF"
          stroke-width="2"
          rx="10"
          filter="url(#dropShadow)" />
    <text x="500"
          y="1080"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="75"
          font-weight="600"
          fill="#007BFF">        
        浦安発・災害対策技術
    </text>
    <text x="500"
          y="1150"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="40"
          font-weight="500"
          fill="#2C3E50">        
        デロイトdXG社会課題解決経験者が開発
    </text>
    <!-- 価格・購入CTA -->
    <rect x="250"
          y="1190"
          width="500"
          height="130"
          fill="#007BFF"
          rx="15"
          filter="url(#dropShadow)" />
    <text x="500"
          y="1260"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="80"
          font-weight="bold"
          fill="#FFFFFF">        
        ¥1,000
    </text>
    <text x="500"
          y="1305"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="40"
          font-weight="500"
          fill="#E3F2FD">        
        今すぐZenn.devで入手
    </text>
    <!-- 限定性アピール -->
    <text x="500"
          y="1360"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="32"
          font-weight="600"
          fill="#E74C3C">        
        浦安停電体験者限定・先行公開中
    </text>
    <!-- 装飾的要素（PNG対応） -->
    <g opacity="0.3">
        <polygon points="50,300 70,280 90,300 70,320"
                 fill="#007BFF" />
        <polygon points="950,400 930,380 910,400 930,420"
                 fill="#28A745" />
        <polygon points="80,1000 100,980 120,1000 100,1020"
                 fill="#FFC107" />
        <polygon points="920,1100 900,1080 880,1100 900,1120"
                 fill="#DC3545" />
    </g>
</svg>