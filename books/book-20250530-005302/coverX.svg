<svg viewBox="0 0 500 700"
     xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%"
                  style="stop-color:#FFFFFF;stop-opacity:1" />
            <stop offset="100%"
                  style="stop-color:#EEEEEE;stop-opacity:1" />
        </linearGradient>
        <filter id="textShadow"
                x="-0.2"
                y="-0.2"
                width="1.4"
                height="1.4">
            <feGaussianBlur in="SourceAlpha"
                            stdDeviation="2" />
            <feOffset dx="2"
                      dy="2"
                      result="offsetblur" />
            <feMerge>
                <feMergeNode in="offsetblur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="glow">
            <feGaussianBlur stdDeviation="5"
                            result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    <rect width="100%"
          height="100%"
          fill="url(#bgGradient)" />
    <path d="M50 50 L450 50 L450 300 L50 300 Z"
          fill="#000"
          opacity="0.1" />
    <g transform="translate(250,350)">
        <path d="M-25,-25 L25,-25 L25,25 L-25,25 Z"
              fill="#00FF00" />
        <path d="M-15,-15 L15,-15 L15,15 L-15,15 Z"
              fill="#000" />
        <path d="M-5,-5 L5,-5 L5,5 L-5,5 Z"
              fill="#00FF00" />
        <animateTransform attributeName="transform"
                          attributeType="XML"
                          type="rotate"
                          from="0"
                          to="360"
                          dur="10s"
                          repeatCount="indefinite" />
    </g>
    <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
       font-weight="bold"
       text-rendering="optimizeLegibility">
        <text x="250"
              y="150"
              text-anchor="middle"
              font-size="96"
              fill="#FF0000"
              stroke="#FFFFFF"
              stroke-width="3"
              filter="url(#textShadow)">
            <tspan x="250"
                   dy="-1em">サンプルコード：</tspan>
        </text>
        <text x="250"
              y="250"
              text-anchor="middle"
              font-size="96"
              fill="#FF0000"
              stroke="#FFFFFF"
              stroke-width="3"
              filter="url(#textShadow)">
            <tspan x="250"
                   dy="0em">レーザー制御</tspan>
        </text>
        <text x="250"
              y="350"
              text-anchor="middle"
              font-size="96"
              fill="#FF0000"
              stroke="#FFFFFF"
              stroke-width="3"
              filter="url(#textShadow)">
            <tspan x="250"
                   dy="1em">コマンドの送信</tspan>
        </text>
        <text x="250"
              y="650"
              text-anchor="middle"
              font-size="32"
              fill="#000000"
              stroke="#FFFFFF"
              stroke-width="1"
              filter="url(#textShadow)">
            <tspan x="250"
                   dy="0em">実践ガイド</tspan>
        </text>
    </g>
</svg>