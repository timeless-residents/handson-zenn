      <stop offset="0%"   stop-color="#ECF0F1"/>
      <stop offset="100%" stop-color="#BDC3C7"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGradient)" />

  <circle cx="250" cy="550" r="150" fill="#3498DB" opacity="0.15"/>
