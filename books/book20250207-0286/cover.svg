  <circle cx="400" cy="100" r="100" fill="#3498DB" opacity="0.1"/>

  <g transform="translate(250, 100)" text-anchor="middle">
    <text x="0" y="0" font-size="106" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" fill="#3498DB" stroke="white" stroke-width="2" text-rendering="optimizeLegibility">実践</text>
    <text x="0" y="110" font-size="126" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" fill="#3498DB" stroke="white" stroke-width="2" text-rendering="optimizeLegibility">システム</text>
    <text x="0" y="230" font-size="136" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" fill="#3498DB" stroke="white" stroke-width="2" text-rendering="optimizeLegibility">信頼性</text>
  </g>

  <g transform="translate(250, 320)" text-anchor="middle">
