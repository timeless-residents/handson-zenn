    <text x="0" y="200" font-size="158" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" fill="#F39C12" stroke="white" stroke-width="1" text-rendering="optimizeLegibility">SRE</text>

  </g>

  <g transform="translate(250, 520)" text-anchor="middle">
    <text x="0" y="80" font-size="82" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" fill="#3498DB" stroke="white" stroke-width="0.5" text-rendering="optimizeLegibility">安定運用と</text>
    <text x="0" y="160" font-size="82" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" fill="#3498DB" stroke="white" stroke-width="0.5" text-rendering="optimizeLegibility">継続的改善</text>
