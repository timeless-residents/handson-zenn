<svg viewBox="0 0 500 700"
     xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%"
                  style="stop-color:#E0F2FE;stop-opacity:1" />
            <stop offset="100%"
                  style="stop-color:#FFFFFF;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%">
            <feGaussianBlur in="SourceAlpha"
                            stdDeviation="3" />
            <feOffset dx="2"
                      dy="2"
                      result="offsetblur" />
            <feMerge>
                <feMergeNode in="offsetblur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="outerGlow">
            <feGaussianBlur in="SourceAlpha"
                            stdDeviation="4"
                            result="blur" />
            <feOffset dx="0"
                      dy="0"
                      result="offsetblur" />
            <feFlood flood-color="#007AFF"
                     flood-opacity="0.5"
                     result="flood" />
            <feComposite in2="offsetblur"
                         in="flood"
                         operator="in"
                         result="composite1" />
            <feComposite in2="SourceGraphic"
                         in="composite1"
                         operator="over"
                         result="composite2" />
        </filter>
    </defs>
    <rect width="100%"
          height="100%"
          fill="url(#bgGradient)" />
    <g transform="translate(25, 50)">
        <text x="0"
              y="60"
              font-family="sans-serif"
              font-size="86"
              font-weight="bold"
              fill="#007AFF"
              text-rendering="optimizeLegibility"
              filter="shadow">
            <tspan x="0"
                   dy="0.9em"
                   stroke="#FFFFFF"
                   stroke-width="1.5"
                   stroke-linejoin="round">iOS自動化</tspan>
        </text>
        <text x="0"
              y="150"
              font-family="sans-serif"
              font-size="86"
              font-weight="bold"
              fill="#007AFF"
              text-rendering="optimizeLegibility"
              filter="shadow">
            <tspan x="0"
                   dy="0.9em"
                   stroke="#FFFFFF"
                   stroke-width="1.5"
                   stroke-linejoin="round">最終兵器</tspan>
        </text>
        <text x="0"
              y="250"
              font-family="sans-serif"
              font-size="84"
              font-weight="bold"
              fill="#34C759"
              text-rendering="optimizeLegibility"
              filter="shadow">
            <tspan x="0"
                   dy="0.9em"
                   stroke="#FFFFFF"
                   stroke-width="1"
                   stroke-linejoin="round">Scriptable</tspan>
        </text>
        <text x="0"
              y="350"
              font-family="sans-serif"
              font-size="68"
              font-weight="bold"
              fill="#34C759"
              text-rendering="optimizeLegibility"
              filter="shadow">
            <tspan x="0"
                   dy="0.9em"
                   stroke="#FFFFFF"
                   stroke-width="1"
                   stroke-linejoin="round">実践レシピ集</tspan>
        </text>
    </g>
    <circle cx="420"
            cy="600"
            r="30"
            fill="#34C759"
            filter="outerGlow" />
    <rect x="50"
          y="50"
          width="60"
          height="60"
          fill="#007AFF"
          filter="outerGlow" />
    <polygon points="100, 500 150, 550 50, 550"
             fill="#007AFF"
             filter="outerGlow" />
</svg>