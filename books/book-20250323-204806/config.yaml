title: "イノベーションを加速する開発：コードが組織を変える実践ガイド"
summary: |-
  本書は、コードがイノベーションをどのように推進するかを解説し、開発環境構築からクラウドネイティブ、AI、ブロックチェーン等の最新技術までを網羅します。コード品質の向上や組織文化の醸成にも触れ、開発者だけでなく、組織全体でイノベーションを起こすための実践的なガイドを提供します。読者は、技術スキルだけでなく、組織論や文化論も学び、持続的なイノベーションを実現するための知識と実践力を得られます。

topics: 
  - Kubernetes
  - RESTfulAPI
  - DevOps
  - 機械学習
  - ブロックチェーン

