<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700">
    <!-- Background gradient -->
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3A0CA3"></stop>
            <stop offset="100%" stop-color="#4361EE"></stop>
        </linearGradient>
        <!-- Shadow filter -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <fedropshadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"></fedropshadow>
        </filter>
    </defs>
    <!-- Background -->
    <rect width="500" height="700" fill="url(#bgGradient)"></rect>
    <!-- Grid pattern to symbolize 3D space -->
    <g stroke="#F9F9F9" stroke-width="1" opacity="0.2">
        <!-- Horizontal lines -->
        <line x1="0" y1="250" x2="500" y2="250"></line>
        <line x1="0" y1="300" x2="500" y2="300"></line>
        <line x1="0" y1="350" x2="500" y2="350"></line>
        <line x1="0" y1="400" x2="500" y2="400"></line>
        <line x1="0" y1="450" x2="500" y2="450"></line>
        <!-- Vertical lines -->
        <line x1="100" y1="200" x2="100" y2="500"></line>
        <line x1="150" y1="200" x2="150" y2="500"></line>
        <line x1="200" y1="200" x2="200" y2="500"></line>
        <line x1="250" y1="200" x2="250" y2="500"></line>
        <line x1="300" y1="200" x2="300" y2="500"></line>
        <line x1="350" y1="200" x2="350" y2="500"></line>
        <line x1="400" y1="200" x2="400" y2="500"></line>
    </g>
    <!-- Abstract 3D cube wireframe -->
    <g transform="translate(250, 350) rotate(30)" stroke="#F9F9F9" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9">
        <!-- Front face -->
        <path d="M-80,-80 L80,-80 L80,80 L-80,80 Z"></path>
        <!-- Back face -->
        <path d="M-60,-100 L100,-100 L100,60 L-60,60 Z"></path>
        <!-- Connecting edges -->
        <path d="M-80,-80 L-60,-100"></path>
        <path d="M80,-80 L100,-100"></path>
        <path d="M80,80 L100,60"></path>
        <path d="M-80,80 L-60,60"></path>
    </g>
    <!-- Additional 3D elements -->
    <g transform="translate(250, 350)">
        <circle cx="0" cy="0" r="25" fill="#7209B7" opacity="0.8"></circle>
        <circle cx="-100" cy="30" r="12" fill="#F72585" opacity="0.8"></circle>
        <circle cx="80" cy="-50" r="18" fill="#4CC9F0" opacity="0.8"></circle>
    </g>
    <!-- Title Text with Season indicator -->
    <g filter="url(#shadow)">
        <text x="250" y="95" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="108" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Three.js</text>
        <text x="250" y="195" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="100" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Everyday</text>
        <!-- Season indicator repositioned to top right corner -->
        <text id="season-text" x="460" y="495" font-family="sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="end" opacity="0.9">SEASON 02</text>
    </g>
    <!-- Stylized Three.js logo hint -->
    <g transform="translate(250, 490)">
        <polygon points="0,-25 22,13 -22,13" fill="#FFFFFF" opacity="0.9"></polygon>
    </g>
    <!-- Dynamic update content area with background - enlarged -->
    <g id="update-container">
        <!-- Semi-transparent background for update text - enlarged -->
        <rect x="20" y="510" width="460" height="180" rx="20" fill="#000000" opacity="0.4"></rect>
        <!-- Update date - enlarged and with ID added -->
        <text id="update-date" x="43" y="550" font-family="sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" opacity="0.9">2025年03月03日(月) 追加!</text>
        <!-- Update content that can be multiple lines - enlarged -->
        <text id="update-content">
            <!-- First line of update content with ID -->
            <tspan id="update-line1" x="35" y="610" font-family="sans-serif" font-size="42" font-weight="bold" fill="#FFFFFF" opacity="0.9">1基本シェーダーの実装</tspan>
            <!-- Second line of update content with ID -->
            <tspan id="update-line2" x="35" y="660" font-family="sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF" opacity="0.9">12パーティクルエフェクト</tspan>
        </text>
    </g>
</svg>